  /* ---------- how it works ---------- */
  // STAB-01 (every regular season 2015-2026, the 2021-2026 measures): the sample at which each number is half skill and
  // half luck for predicting the next season. Bars are in seasons: a regular's 650 trips to the plate, a starter's 32 starts.
  var LUCK = [
    ["Hitters", [["How often he strikes out", 113 / 650, "about a month (110 trips to the plate)"],
                 ["How hard he hits the ball", 27 / 162, "about a month (75 balls in play)"],
                 ["How often he walks", 232 / 650, "about two months (230 trips)"],
                 ["How often he homers", 317 / 650, "about half a season (320 trips)"]]],
    ["Pitchers", [["How hard he throws", 1 / 32, "one start (about 50 fastballs)"],
                  ["How often he strikes hitters out", 223 / 736, "about 10 starts (220 batters)"],
                  ["How often he walks hitters", 489 / 736, "about 20 starts (490 batters)"],
                  ["How often he gives up home runs", 1040 / 736, "about a season and a half (1,040 batters)"]]]
  ];

  function luckChart() {
    var max = 1.5, at = function (v) { return (Math.min(v, max) / max * 100).toFixed(1) + "%"; };
    var ticks = [[1 / 6, "1 month"], [0.5, "\u00bd season"], [1, "1 season"], [1.5, "1\u00bd seasons"]];
    var h = "<h2>Skill or luck?</h2><p>Every player's numbers are part skill and part luck. A hitter can hit .400 for a week by luck alone. To know how much to trust a number, we measured on every season since 2015 how long each one takes before it is half skill and half luck. Until then it says more about luck than about the player, so the model pulls it toward the league average.</p>";
    h += '<div class="luck" role="img" aria-label="How long each number takes to become half skill and half luck">';
    LUCK.forEach(function (grp) {
      h += "<h3>" + esc(grp[0]) + "</h3>";
      grp[1].forEach(function (r) {
        h += '<div class="luck-row"><div class="luck-top"><b>' + esc(r[0]) + "</b><span>" + esc(r[2]) + '</span></div><div class="luck-track">' +
          ticks.slice(0, 3).map(function (t) { return '<i style="left:' + at(t[0]) + '"></i>'; }).join("") + '<div class="luck-fill" style="width:' + at(r[1]) + '"></div></div></div>';
      });
    });
    h += '<div class="luck-axis" aria-hidden="true">' + ticks.map(function (t) { return '<span style="left:' + at(t[0]) + '">' + esc(t[1]) + "</span>"; }).join("") + "</div></div>";
    h += "<p>So a pitcher who has given up almost no home runs for two months has mostly been lucky, while a hitter who strikes out a lot in April will probably keep doing it in May. Pitchers control their strikeouts far more than the hits and home runs they give up.</p>";
    return h;
  }

  function renderHow() {
    var fx = latestForecasts(), any = Object.keys(fx).map(function (k) { return fx[k]; }).reduce(function (a, b) { return !a || String(b.history_through || "") > String(a.history_through || "") ? b : a; }, null) || {}, h = '<div class="wrap"><div class="page-head"><h1>How it works</h1><p>Where the numbers come from and how to read them. Tap any gray line for more.</p></div><div class="prose">';
    h += '<ol class="steps"><li><b>Rate every player</b><span>Each hitter and pitcher, on every pitch he has seen up to the day before: what he swings at, how hard he hits it, how he pitches.</span></li>' +
      "<li><b>Play the game 10,000 times</b><span>One at-bat at a time, with the real lineups, the starters, the bullpens, the ballpark and the weather.</span></li>" +
      "<li><b>Count what happened</b><span>Who won and by how much, who homered, how long each starter lasted, what decided it.</span></li>" +
      '<li><b>Check it against the real game</b><span>Every number goes up before first pitch and is never changed. The Record page grades it after the final.</span></li></ol>';
    h += "<h2>One game, ten thousand times</h2><p>Before every game we play it ten thousand times on the computer, one at-bat at a time, with the real lineups and the real pitchers. Until a team posts its lineup we use the last one it ran out against a starter who throws with the same hand. Every hitter and pitcher is rated on everything he has done up to the day before. If the Cubs win 5,800 of the 10,000, the simulator says Cubs 58%.</p>";
    var physicsModel = Object.keys(fx).some(function (k) { return /physics|pitch02b|chain|spring02|retrain/i.test(String(fx[k].model || "")); });
    if (physicsModel) {
      h += '<details class="more"><summary>What it knows about each player</summary><p>His results, splits, recent form, the park and his age, plus the pitch tracking from every earlier game. For hitters: exit velo, launch angle, hard-hit and barrel rates, what his contact should be worth, and how often he swings, misses, chases and makes contact in the zone, with his last 30 days next to his norm. For pitchers: velo and how his last outing compared, spin and movement, whiffs, chases, strikes, the contact he gives up, ground balls, and the same 30-day form. The at-bat model was fit on 2023 and 2024, tuned on 2025 and tested on all of 2026 before we used it. Since October 17 it is refit on 2023 to 2025, tuned on the first half of 2026 and tested on the season\'s last six weeks before use; the old fit had drifted, and the refit was worth more than any single new feature of the day.</p></details>';
    }
    h += luckChart();
    var chainModel = Object.keys(fx).some(function (k) { return /pitch02b|chain|spring02|retrain/i.test(String(fx[k].model || "")); });
    if (chainModel) {
      h += '<details class="more"><summary>How it builds an at-bat, pitch by pitch</summary><p>Since October 16 the at-bat model also reads a pitch-by-pitch chain. Every pitch since 2021 (4.3 million of them) sits in one of 15 boxes: fastball, breaking ball or offspeed, and where it crossed: top, middle or bottom of the zone, above it or below it. For tonight\'s matchup the chain asks, one count at a time: what does this pitcher throw in this count, does this hitter swing at that box, does he miss it, foul it or put it in play, and what happens when he does. The at-bat\'s odds fall out of the count. Each hitter and pitcher is measured against what the league does on the same pitches, so a rookie starts as an average player and moves away from it only as his own pitches come in, with recent weeks counting most.</p><p>Why it helps: a hitter\'s home run rate takes half a season to mean anything, but how often he chases a slider below the zone is clear in a few weeks. Pitch by pitch, knowing the two players beats league averages by about 8 per 1,000 on swings and 11 per 1,000 on misses. Added to the at-bat model it was worth about half as much as the pitch tracking itself, and it went live only after full re-runs of 2025 and 2026 showed it picked winners no worse and kept runs and strikeouts where they belong.</p><p>Spring training counts too. Each player\'s tracked spring pitches (about 100,000 a year, nearly every park since 2026) go into his own counters before Opening Day, so a hitter who chased sliders all March starts the season with that on his record instead of as a blank. It never touches the league averages or the parks. In a 2026 test it helped most in March and April, as expected, and a little all season.</p><p>Thin data borrows from the player first. A hitter\'s record is kept in twelve boxes (pitch type, in or out of the zone, two strikes or not). A box with few pitches used to say nothing; now it starts from the player\'s own overall tendency and moves from there, so a hitter who chases everything is expected to chase a pitch type he has barely seen yet. Pitch by pitch this was worth 3 per 1,000 on swings and 6 per 1,000 on misses, most of it early in the season.</p></details>';
    }
    var hw = D.record && D.record.headline_now, wt = hw && hw.market != null ? Math.round(hw.market * 100) + "% the betting line and " + Math.round(hw.ours * 100) + "% ours" : "60% the betting line and 40% ours";
    h += "<h2>Our number</h2><p>Our own number mixes the simulator with a team model: runs scored and allowed, home field, how the team has been playing, and the starters. Once Vegas posts a line, the game card shows a blend of " + wt + ". Our own number never looks at the line for that game. The Odds tab shows each piece, and the Record page keeps score on all of them.</p>";
    h += '<details class="more"><summary>Why blend with Vegas</summary><p>The closing line is the hardest number in baseball to beat, so we use it. We set our model\'s weights on closing lines from 4,140 games in 2025 and 2026, because lines are steadier than wins and losses, then checked it against real results from a season it never saw. When we disagreed with the opening line, the line moved our way by first pitch about 7 times in 10. That is not a betting system. Any change to how we figure the number starts at a stated time and never touches a game that has started. Through October 7, 2026 our number was a straight average of the simulator and the team model.</p></details>';
    h += "<h2>What to expect and what decides it</h2><p>A game page opens with the game in plain words: a typical final score, how many runs, a picture of 100 games, and the few things that swing it most. Because we play the game ten thousand times, we can count how often each thing happens (the home team scores first in 46 games out of 100, say) and how often a team wins when it does and when it does not. We pick the ones that move the win chance most: scoring first, each starter getting through six innings, and the hitters whose home run or two-hit night matters most. The two chances are moved together so that, mixed, they give our pick. We checked them on every game of 2025 and 2026 re-run: teams that scored first won 67% of the time and the simulator had said 67%; the starter, home run and two-hit chances came within about a point of what happened too.</p><p>Below that, one of the simulated games plays out like a live game tracker: tap Watch it to see every play, the runners, where the ball went and the win chance after each play.</p>";
    h += "<h2>Game plan</h2><p>Every game has a Game plan tab. For each hitter it says where to pitch him and where not to, against each pitcher he is likely to see, using only pitches thrown before that day. A hitter decides whether to swing about a quarter second before the ball gets there, so we map where the pitch looks like it is going at that moment, not just where it ends up. That calls his swings and takes better than a regular heat map, and it shows where he will chase against a certain pitcher's stuff. After the game, the same tab grades it: did the pitches go where we said, and did the hitters chase where we said they would.</p>" +
      '<details class="more"><summary>Hot zones and the hitter and pitcher tags</summary>' + "<p>Each hitter also has the standard hot-zone chart: MLB's 13 zones from the catcher's view, nine in the strike zone and four around it, with his batting average, slugging, swing rate or miss rate in each, red above the league average and blue below. These are plain counts from the last two seasons, split by the pitcher's hand; the plan's spots come from the swing map, so the two can differ. The Expected view pulls thin numbers toward what predicted the next season best: a hitter's batting average and slugging against lefties or righties, beyond the usual split for his side, did not carry over from one season to the next (we checked 317 hitters), so his expected line against a hand is his level against everyone with that usual split. Pitcher cards show where he throws each pitch on the same zones, hitter cards show where he hits the ball (ground balls and balls in the air, pulled, up the middle or the other way), and each plan has a bullpen card with every arm's pitches on the days before the game.</p>" +
      "<p>The tags on each hitter (chases a lot, takes the first pitch, expands or holds his zone with two strikes, misses breaking balls, misses up in the zone, hits the low strike hard, pulls grounders and the rest) were each checked the same way: tag hitters from two seasons, then watch the next season. Every one of them held up, smaller than in the seasons we tagged from (about half to nine-tenths of the size), since the most extreme hitters drift back toward the middle. Pitcher tags (throws first-pitch strikes, lives in the zone, fastballs or spin when behind, elevates fastballs, buries breaking balls, ground-ball pitcher and the rest) went through the same check. A read that did not hold up, extra misses on hard fastballs, is left off. Each plan sheet starts with what these tags say about the lineup: who to get ahead of, who to start off the plate, how to finish each one, whom to shade the infield for and which runners to hold. Player pages open with percentile rankings like the ones on Baseball Savant.</p></details>";
    h += '<details class="more"><summary>What the spots are worth</summary><p>Pitchers do not aim at these spots now; we checked. With normal command and hitters who do not adjust much, we estimate a staff aiming at them would save about 30 to 40 runs over a season on pitches out of the zone, and about 24 more on strikes put where the hitter takes them or cannot do much with them. That is what is possible, not runs already saved. On October 10 we fixed three things in how a pitch is priced: the model was calling about 1 in 10 too many chases, it gave umpires more strikes just off the plate than they really call, and it counted too many foul balls. We re-checked these figures with all three fixed; they barely moved. We tested the method on made-up seasons where we knew the right answer before putting the number up. An earlier estimate, 32 runs, overstated its own method and was withdrawn. Past games work the same way, using only earlier pitches. The Players page has every hitter and pitcher, rebuilt each day. Every test we ran, including the ones that failed, is in the ledger in our code.</p></details>';
    var adj = {};
    Object.keys(D.box_scores || {}).forEach(function (id) { var b = D.box_scores[id]; if (b.date === D.date && b.adjustments) b.adjustments.forEach(function (a) { adj[a] = 1; }); });
    if (Object.keys(adj).length) {
      var has = function (re) { return Object.keys(adj).some(function (a) { return re.test(a); }); };
      h += '<details class="more"><summary>What we add on game day</summary><p>The at-bat model is set before the season and does not change during it. These get added when the games are played out, and each one was checked on earlier games before we turned it on.</p><ul>';
      if (has(/context offsets/)) h += "<li><b>First inning.</b> Road hitters do worse in the top of the first and home hitters do better in the bottom of the first. The at-bat model does not know that, so we add it, using amounts measured on earlier seasons. The same step sets the league's overall strikeout, walk and home run levels, which brought starters' projected strikeouts in line with the real average in 2025 and 2026.</li>";
      if (has(/postseason/)) h += "<li><b>Postseason starters.</b> In the Wild Card round, the Division Series and the LCS, starters face about 87% as many batters as in a regular-season start, and a quarter of them are gone before the order turns over twice (294 postseason starts, 2023 to 2026). We shorten the starter's expected outing to match, and since October 16 by the starter's own class: the best starters (by strikeouts minus walks this season) keep about 94% of their regular length, the middle 89%, the rest 81%, as October managers actually did from 2023 to 2026. The World Series looks like the regular season, so it is left alone.</li>";
      if (has(/run environment/)) h += "<li><b>Weather and ballpark.</b> The at-bat model only knows the park through the home team and knows nothing about weather. We adjust each game for the temperature at first pitch (about 8% more home runs for every 10 degrees), a closed roof, day games and the wind at Wrigley. We tried adding how each park played beyond what the model expects, but a park's number one year told us nothing about the next, so it is out. If the weather is not posted yet, we use the park's normal temperature for that month.</li>";
      if (has(/team offsets/)) h += "<li><b>Team effects.</b> The at-bat model rates players one at a time, and some teams beat that all year: defenses that turn more balls in play into outs, staffs and catchers that get more strikeouts than the pitchers' own numbers say, lineups that run better or worse than their history. Each team gets a small adjustment from its earlier games, with recent games counting more. On full re-runs of 2025 and 2026 it made the win chances better in both seasons.</li>";
      if (has(/reliever choice|reliever exits/)) h += "<li><b>Bullpens.</b> Who comes out of the bullpen is fitted on every relief appearance from 2023 to 2026: how much each arm has pitched the last few days, the inning he usually works over the year and the last three weeks, his strikeout record, the hands of the next three hitters, and the score and inning." + (has(/roster pools/) ? " Since October 17 it is fitted on each day's actual roster, so call-ups, trades, returns from the injured list and starters moved to the pen are counted the way managers use them; that lifted the share of real relief entries the model could name from 92% to 98%." : "") + " When a pitcher comes out is fitted on every real pitching change, with each team's own habit of going to the bullpen early or late." + (has(/postseason reliever exits/) ? " In October managers run the bullpen differently (4.1 relievers a team per game against 3.3 in the regular season): a reliever in trouble comes out about twice as readily mid-inning, and one who finishes an inning clean is sent back out for another more often. Measured on every postseason relief decision from 2022 to 2026, World Series included." : "") + " On full re-runs of 2025 and 2026, each team used 4.2 pitchers a game against 4.3 in the real games, and the win chances were a little better in both seasons.</li>";
      if (has(/stolen bases/)) h += "<li><b>Base running.</b> Every runner runs at his own sprint speed, and runners steal at their own rates, adjusted for how often the pitcher on the mound gets run on and how often runners make it against him. On all of 2026 it moved the simulator closer to both the results and Vegas.</li>";
      if (has(/starter exits by inning/)) h += "<li><b>When starters come out.</b> Managers like a starter to finish the 5th inning: after the 4th ends, real starters come out about a third less often than a plain fit on batters faced, runs and score says. In regular-season games the starter's exit chance carries a correction by inning, its end and the score, fitted on 2023 and 2024; re-run on 2025 and 2026, it put the share of starts ending in the 4th inning right and left the win chances and totals as good as before.</li>";
      if (has(/play-by-play/)) h += "<li><b>Runners after each play.</b> After every play, runners move the way they do in real games, taken from every play of 2023 to 2026 with the same result, bases and outs: how often an out with a man on first turns into a double play (23% with fewer than two out), how often the runner on third scores on an out (54% with fewer than two out), how often a runner scores from second on a single or from first on a double. Faster runners take the extra base more often and faster hitters beat out more double plays. On all of 2025 and 2026 it got batters per game right and made the win chances a little better both seasons.</li>";
      if (has(/talent noise/)) h += "<li><b>How sure we are about each player.</b> Nobody knows exactly how good a player is. Each of the ten thousand games uses a slightly different level for every player, with more spread for players with less history, so the ranges show what we do not know.</li>";
      h += "</ul></details>";
    }
    h += "<h2>Player pages</h2><p>Every hitter and pitcher with enough pitches has a page: his season line and last ten games from MLB, percentile rankings against everyone with 300 or more plate appearances or batters faced, his splits, hot zones, where he hits it, and for pitchers the arsenal, how each pitch moves and his fastball speed game by game.</p>" + '<details class="more"><summary>What we checked before showing it</summary>' + "<p>A hitter's last ten games told almost nothing about his next ten in getting on base or slugging (strikeouts carried a little), and a split against lefties or righties beyond the usual one for his side mostly did not carry over to the next season, for hitters or pitchers, so the Expected view leans on the usual split. A starter's fastball speed did carry: about 45% of a change in his last start showed up again in the next one, and starters coming off a drop of a mile per hour or more struck out about two fewer batters per 100.</p></details>";
    h += "<h2>Team stats, props and past meetings</h2><p>Before first pitch the Summary shows both teams' season numbers from MLB, each with the club's rank among the 30. The Odds tab lists each starter's strikeouts and hits allowed the way sportsbooks do, with our chance of going over each line and its fair price; re-run over two seasons, those chances came within about 2 points of how often starters actually got there. Starting with next season's regular-season games, it also lists each starter's outs recorded the same way. Each hitter's chances there are his own: the trips a pinch hitter or substitute takes from his spot late in games are allowed for, on average for each spot in the order. The Matchups tab adds each hitter's career line against the starting pitcher, from MLB. Those are small samples: over four seasons, beyond each player's own level, a 20 plate-appearance record carried between none and about 15% of its on-base edge into later meetings.</p>";
    h += "<h2>The projected game</h2><p>One of the ten thousand games: the one closest to the middle on runs, hits and each starter's innings and strikeouts, with our pick winning in nine innings. It reads like a box score, but it is one likely way the night goes, not a promise. The high-scoring, low-scoring and upset versions show the range.</p>";
    h += "<h2>During the game</h2><p>While a game is on, the page checks MLB's feed every 15 seconds for the score, the plays and every pitch. The win chance moves after each play, using the same ten thousand games from before first pitch and how real games have gone from the same spot.</p>";
    h += "<h2>Past and future games</h2><p>Tap Games, then use the date strip or the calendar. Any day of 2025 and 2026 works. Past days show the real box score next to what we said, and how our picks did that day. Before October 6, 2026 those are re-runs: we played each game again after the season using only what was known before it. For tomorrow, we post an early number the night before once both starters are announced, using projected lineups, and update it on game day when the real lineups come out. Further out you see the schedule.</p>";
    h += "<h2>Checking the work</h2><p>Every number goes up before first pitch and never gets changed. After the final, the Record page grades the last number we posted against a coin flip, always picking the home team, and Vegas. Nothing gets filled in after the fact.</p>";
    h += "<h2>What it does not do yet</h2><ul><li>In the postseason, which reliever comes in follows regular-season habits. Only how long starters and relievers stay in is set for October.</li><li>The pitches shown inside a simulated at-bat are just for show, borrowed from real at-bats that ended the same way. They do not decide anything.</li><li>No wild pitches or passed balls.</li><li>Simulated games are a little less spread out than real ones: blowouts come up somewhat less often (games decided by five or more, 27% against 29% in the last two seasons re-run), so the page does not show a run line yet. The run charts and ranges on the Odds tab are widened to match: they keep the simulator's averages and spread them as much as real scores spread, and re-run over two seasons they then held the real score about as often as they said.</li><li>Player history runs through " + esc(/^\d{4}-\d{2}-\d{2}$/.test(any.history_through || "") ? dateLabel(any.history_through).replace(/^[A-Za-z]+, /, "") : (any.history_through || "the day before")) + ".</li></ul>";
    var modelNames = []; Object.keys(fx).forEach(function (k) { var m = String(fx[k].model || ""); if (m && modelNames.indexOf(m) < 0) modelNames.push(m); });
    h += "<h2>Nuts and bolts</h2><p>At-bat model " + esc(modelNames.join(", ") || any.model || "") + ". " + Number(any.n_simulations || 0).toLocaleString() + " games played out per forecast. When lineups change we save a new version and keep the old ones. The code is public; the player data and model files are not.</p>";
    var vs = Object.keys(fx).map(function (k) { return fx[k]; }).filter(function (f) { return f.date === D.date; });
    vs.forEach(function (f) {
      var all = versionsFor(f.game_pk);
      h += '<details class="ver-hist"><summary>' + esc(f.away.abbr + " at " + f.home.abbr) + ": " + all.length + (all.length === 1 ? " saved version" : " saved versions") + '</summary><ul>';
      all.forEach(function (x) { h += "<li>Version " + x.version + ", " + esc(timeET(x.saved_at)) + " ET: " + esc(x[favorite(x)].abbr) + " " + pct(winProb(x, favorite(x))) + "</li>"; });
      h += "</ul></details>";
    });
    app.innerHTML = h + "</div></div>";
  }

  /* ---------- boot ---------- */
  function boot(json) {
    D = json;
    window.addEventListener("hashchange", route);
    if (window.matchMedia) {
      var scheme = window.matchMedia("(prefers-color-scheme: dark)"), onScheme = function () { NIGHT = scheme.matches; route(); };
      if (scheme.addEventListener) scheme.addEventListener("change", onScheme); else if (scheme.addListener) scheme.addListener(onScheme);
    }
    route();
    setInterval(lcTick, 15000);
    setTimeout(lcTick, 1200);
    window.addEventListener("hashchange", function () { setTimeout(lcTick, 300); });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") lcTick(); });
    fetch("days/index.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (idx) {
      if (idx && idx.dates) { ARCHIVE = idx; if (!location.hash || /^#\/?$/.test(location.hash) || /^#\/day\//.test(location.hash)) route(); }
    }).catch(function () {});
  }
  if (window.BRL) boot(window.BRL);
  else fetch(DATA_URL, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(boot).catch(function () {
    app.innerHTML = '<div class="wrap"><p class="empty">Forecasts could not load. Refresh the page to try again.</p></div>';
  });
})();
</script>
</body>
</html>
