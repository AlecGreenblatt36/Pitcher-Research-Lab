<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12213A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B2F" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Baseball Research Lab</title>
<style>
/*FONTS*/
:root {
  --paper: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #162033;
  --muted: #566074;
  --rule: #D6DCE5;
  --rule-soft: #E8ECF2;
  --board: #12213A;
  --board-slot: #0C182B;
  --board-line: #2A4060;
  --chalk: #F5F7FB;
  --chalk-dim: #B4C0D3;
  --away: #2E5C9A;
  --home: #B42A30;
  --lamp: #F0B23A;
  --btn: #12213A;
  --btn-ink: #F5F7FB;
  --good: #1F6B47;
  --bad: #B42A30;
  --live: #C8312B;
  --hover: #ECF0F5;
  --rule-strong: #A9B3C3;
  --mid: #96A1B3;
  --tint: #F7F9FB;
  --good-tint: #E8F2EC;
  --grass: #E6EEE4;
  --dirt: #E9DFC7;
  --field-line: #FFFFFF;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
/* Night: the same night board, a dark field around it; team colors are lifted in script (teamColors) so dark
   club colors stay readable. */
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0A0F18; --surface: #121A27; --ink: #E6EBF3; --muted: #9AA6B9; --rule: #26324A; --rule-soft: #1A2335;
    --board: #0F1B2F; --board-slot: #0A1322; --board-line: #263A58; --good: #4DB184; --bad: #E2595F; --live: #F06A63; --btn: #F0B23A; --btn-ink: #0A0F18;
    --hover: #182235; --rule-strong: #3E4D66; --mid: #5E6C84; --tint: #151E2D; --good-tint: #12291F;
    --grass: #1A2A20; --dirt: #2B271E; --field-line: #3B4B41;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Top bar */
.top { background: var(--board); color: var(--chalk); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; column-gap: 12px; min-height: 56px; }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .01em; color: var(--chalk); text-decoration: none; white-space: nowrap; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 0 3px rgba(240,178,58,.18); }
.nav { display: flex; gap: 2px; }
.nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; text-decoration: none; font-weight: 700; font-size: 15px; color: var(--chalk-dim); border-radius: 8px; }
.nav a:hover { color: var(--chalk); }
.nav a[aria-current="page"] { color: var(--chalk); background: rgba(255,255,255,.09); box-shadow: inset 0 -3px 0 var(--lamp); }

/* Slate */
.page-head { padding: 22px 0 6px; }
.page-head h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.05; margin: 0; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.page-head p.tagline { color: var(--ink); font-size: 17px; }
.dstrip { display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px 44px; align-items: center; gap: 4px; margin: 14px 0 2px; }
.dstrip-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.dstrip-day { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 54px; border-radius: 12px; text-decoration: none; color: var(--muted); }
.dstrip-day small { font-size: 14px; font-weight: 700; line-height: 1.15; }
.dstrip-day.today b::after { content: ""; display: block; width: 6px; height: 6px; margin: 2px auto 0; border-radius: 50%; background: var(--lamp); }
.dstrip-day.today { padding-top: 4px; }
.dstrip-day b { font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.05; color: var(--ink); }
.dstrip-day:hover { background: var(--hover); }
.dstrip-day[aria-current="date"] { background: var(--board); color: var(--chalk-dim); }
.dstrip-day[aria-current="date"] b { color: var(--chalk); }
.dstrip-step { display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 10px; color: var(--ink); }
.dstrip-step svg { width: 16px; height: 16px; }
.dstrip-step:hover { background: var(--hover); }
.dstrip-step[aria-disabled="true"] { opacity: .28; pointer-events: none; }
.dstrip-pick { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; }
.dstrip-pick svg { width: 20px; height: 20px; }
.dstrip-pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.day-sum { margin: 14px 0 0; font-size: 17px; }
.day-sum b { font-family: var(--display); font-size: 23px; font-weight: 700; }
.nw { white-space: nowrap; }
.pl-next { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0 8px; }
.pl-next span { font-weight: 700; color: var(--muted); }
.pl-next a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--rule-strong); background: var(--surface); font-weight: 700; color: var(--ink); text-decoration: none; }
.pt-list { margin: 8px 0 4px; }
.pt { border-top: 1px solid var(--rule); padding: 12px 0; }
.pt h4, .pt h2.card-h { margin: 0 0 4px; font-size: 18px; display: flex; justify-content: space-between; gap: 12px; }
.pt h4 span, .pt h2.card-h span { font-family: var(--display); font-weight: 600; white-space: nowrap; }
.pt p { margin: 2px 0 0; font-size: 15px; }
.next-day { display: inline-flex; align-items: center; min-height: 44px; padding: 6px 16px; margin-top: 4px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--surface); font-weight: 700; color: var(--ink); text-decoration: none; }
.replay-note { font-size: 14px; color: var(--muted); margin: 12px 0 0; padding: 9px 12px; border-left: 3px solid var(--lamp); background: var(--surface); border-radius: 0 8px 8px 0; }
.scorebar { display: flex; flex-wrap: wrap; gap: 1px; margin: 12px 0 4px; background: var(--board-line); border-radius: 12px; overflow: hidden; text-decoration: none; color: var(--chalk-dim); }
.scorebar div { flex: 1 1 110px; min-width: 0; background: var(--board); padding: 10px 12px; }
.scorebar b { display: block; font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; color: var(--chalk); }
.scorebar span { font-size: 14px; line-height: 1.25; display: block; margin-top: 3px; }
.scorebar:hover div { background: var(--board-slot); }
details.more { margin: 8px 0 0; }
details.more summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--muted); list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+"; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--rule-strong); font-size: 16px; line-height: 1; flex: 0 0 22px; }
details.more[open] summary { color: var(--ink); }
details.more[open] summary::before { content: "\2212"; }
.cards { list-style: none; margin: 14px 0 32px; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.card { display: block; position: relative; overflow: hidden; text-decoration: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 16px 16px; }
.card:hover { border-color: var(--rule-strong); }
.card-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; display: flex; }
.card-bar i { display: block; height: 100%; }
.card-top { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--muted); margin-bottom: 6px; }
.card-ctx { font-size: 14px; color: var(--muted); margin: -2px 0 8px; }
.sim-line { margin: 12px -16px 0; padding: 2px 16px 12px; background: var(--board); color: var(--chalk); }
@media (min-width: 600px) { .sim-line { margin: 12px 0 0; border-radius: 12px; } }
.bl { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.bl li { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; }
.bl li > b { font-family: var(--display); font-size: 22px; line-height: 1; }
.bl li > span:nth-child(2) { justify-self: end; align-self: center; color: var(--muted); font-size: 14px; }
.bl-v { display: flex; flex-direction: column; font-size: 14px; color: var(--muted); margin-top: 6px; }
.bl-v b { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--ink); }
.bl-w { grid-column: 1 / -1; font-size: 14px; color: var(--muted); margin-top: 6px; }
.steps { list-style: none; counter-reset: st; margin: 6px 0 28px; padding: 0; display: grid; gap: 0; }
.steps li { counter-increment: st; position: relative; display: flex; flex-direction: column; padding: 0 0 18px 48px; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: -2px; width: 32px; height: 32px; border-radius: 50%; background: var(--board); color: var(--chalk); font-family: var(--display); font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 15px; top: 34px; bottom: 2px; width: 2px; background: var(--rule); }
.steps b { font-family: var(--display); font-size: 21px; line-height: 1.15; }
.steps span { color: var(--muted); }
.watch { margin: 14px 0 0; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); overflow: hidden; }
.wt-stage { padding: 0 0 4px; }
.wt-bug { display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: var(--board); color: var(--chalk); }
.wt-t { display: inline-flex; gap: 8px; align-items: baseline; font-family: var(--display); font-size: 22px; color: var(--chalk-dim); }
.wt-t.bat { color: var(--chalk); }
.wt-t.bat b:first-child::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 5px; border-radius: 50%; background: var(--lamp); vertical-align: 4px; }
.wt-t .num { color: var(--chalk); font-weight: 700; }
.wt-inn { margin-left: auto; font-size: 14px; color: var(--chalk-dim); text-align: right; }
.wt-outs { display: inline-flex; gap: 4px; }
.wt-outs i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--chalk-dim); }
.wt-outs i.on { background: var(--lamp); border-color: var(--lamp); }
.wt-field { display: block; width: 100%; max-width: 420px; margin: 8px auto 0; }
.wt-grass { fill: var(--grass); }
.wt-dirt { fill: var(--dirt); }
.wt-base { fill: var(--surface); stroke: var(--rule-strong); stroke-width: 1.2; }
.wt-base.on { fill: var(--lamp); stroke: #9A6A10; }
.wt-plate { fill: var(--surface); stroke: var(--rule-strong); }
.wt-flight { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 3 3; opacity: .55; }
.wt-flight.gb { stroke-dasharray: 1 3; }
.wt-ball { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.wt-ball.hit { fill: var(--lamp); stroke: #9A6A10; }
.wt-spark { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 8px; margin: 6px 14px 0; font-family: var(--display); font-weight: 700; font-size: 14px; }
.wt-spark span { grid-column: 1; line-height: 1; }
.wt-spark svg { grid-column: 2; grid-row: 1 / 3; width: 100%; height: 64px; }
.wt-spark span:first-child { align-self: start; }
.wt-spark span:nth-child(3) { align-self: end; }
.wt-mid { stroke: var(--rule-strong); stroke-width: 1; stroke-dasharray: 2 3; }
.wt-line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.wt-who { margin: 8px 14px 0; font-size: 14px; color: var(--muted); }
.wt-play { display: flex; gap: 10px; align-items: flex-start; min-height: 3.2em; margin: 6px 14px 0; font-size: 16px; }
.wt-play .tag { flex: 0 0 42px; }
.wt-wp { display: flex; justify-content: space-between; margin: 4px 14px 10px; font-weight: 700; }
.wt-wp .num { color: var(--muted); font-weight: 400; font-size: 14px; }
.wt-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px 10px; border-bottom: 1px solid var(--rule-soft); }
.wt-ctl button { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
.wt-ctl button svg { width: 20px; height: 20px; fill: currentColor; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.wt-ctl .wt-go { flex: 1 1 auto; background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.wt-ctl input[type=range] { flex: 1 1 100%; accent-color: var(--btn); min-height: 28px; }
.hero.compact .vs-pct { font-size: 40px; margin: 2px 0 0; }
.hero.compact .vs-name { font-size: 22px; }
.hero.compact .vs-sp small, .hero.compact .hero-series, .hero.compact .hero-venue, .hero.compact .vs-abbr { display: none; }
.hero.compact .vs-call { font-size: 20px; margin-top: 8px; }
.hero.compact .vs-at { margin-top: 18px; }
/* before first pitch the win chance is the headline number; the projected score is a quieter guide */
.card.pre .team-row .big { font-size: 22px; font-weight: 600; color: var(--muted); }
.card.pre .team-row .pct { font-size: 28px; font-weight: 700; }
.call.even { background: var(--tint); }
.g-pieces { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.to-mu { margin: 0 0 26px; color: var(--muted); }
.linkish { border: 0; background: none; padding: 0; min-height: 44px; font: inherit; font-weight: 700; color: var(--ink); text-decoration: underline; cursor: pointer; }
.ka-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.ka { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; }
.ka-tag { font-family: var(--display); font-weight: 700; font-size: 15px; text-align: center; border-radius: 6px; padding: 2px 0; background: var(--tint); color: var(--muted); }
.ka.did .ka-tag { background: var(--board); color: var(--chalk); }
.ka-t b { display: block; }
.ka-t small { display: block; color: var(--muted); font-size: 14px; }
.card-call { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.15; color: var(--ink); margin: 0 0 6px; text-wrap: balance; }
.card-call.hit::before, .card-call.miss::before { display: inline-block; margin-right: 6px; font-size: 16px; vertical-align: 1px; }
.card-call.hit::before { content: "\2713"; color: var(--good); }
.card-call.miss::before { content: "\2717"; color: var(--bad); }
.card-call.flip::before { content: "\2013"; color: var(--muted); display: inline-block; margin-right: 6px; }
.team-name .rec { font-size: 14px; color: var(--muted); font-weight: 500; }
.state { font-weight: 700; font-size: 14px; }
.state.live { color: var(--live); }
.state.final { color: var(--ink); }
.state .mini { display: inline-block; vertical-align: -3px; margin-right: 6px; width: 18px; height: 16px; }
.state .mini rect { fill: none; stroke: currentColor; stroke-width: 1.4; }
.state .mini rect.on { fill: currentColor; }
.cols { display: grid; grid-template-columns: 1fr 56px 56px; align-items: end; font-size: 14px; color: var(--muted); }
.cols span { text-align: right; }
.team-row { display: grid; grid-template-columns: 50px 1fr 56px 56px; align-items: center; padding: 7px 0; }
.team-row.lost .team-name, .team-row.lost .big { color: var(--muted); }
.team-row.lost .big { font-weight: 600; }
.team-row + .team-row { border-top: 1px solid var(--rule-soft); }
.abbr { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .01em; }
.team-name { font-weight: 700; font-size: 17px; line-height: 1.2; }
.team-name small { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
.team-row .big { font-family: var(--display); font-weight: 700; font-size: 30px; text-align: right; line-height: 1; }
.team-row .pct { font-family: var(--display); font-weight: 600; font-size: 22px; text-align: right; color: var(--muted); }
.team-row.fav .pct { color: var(--ink); }
.away-c { color: var(--away-t, var(--away)); }
.home-c { color: var(--home-t, var(--home)); }
.card-foot { margin-top: 8px; font-size: 14px; color: var(--muted); }
.card-foot.hit::before, .card-foot.miss::before { display: inline-block; width: 16px; font-weight: 700; }
.card-foot.hit::before { content: "\2713"; color: var(--good); }
.card-foot.miss::before { content: "\2717"; color: var(--bad); }
.lamp { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--lamp); margin-right: 6px; vertical-align: 1px; }

/* Game hero */
.hero { background-color: var(--board); background-image: radial-gradient(90% 130% at 0% 0%, var(--away-d, var(--board)) 0%, transparent 62%), radial-gradient(90% 130% at 100% 0%, var(--home-d, var(--board)) 0%, transparent 62%); color: var(--chalk); }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 8px; margin: 8px 0 4px; }
.vs-team { display: flex; flex-direction: column; min-width: 0; }
.vs-team.home { align-items: flex-end; text-align: right; }
.vs-abbr { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .02em; color: var(--chalk-dim); }
.vs-name { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; color: var(--chalk); }
.vs-pct { font-family: var(--display); font-weight: 500; font-size: 64px; line-height: 1; margin: 6px 0 4px; color: var(--chalk); opacity: .78; }
.vs-team.fav .vs-pct { font-weight: 700; opacity: 1; }
.vs-sp { font-size: 15px; color: var(--chalk); line-height: 1.35; }
.vs-sp small { display: block; color: var(--chalk-dim); font-size: 14px; white-space: pre-line; }
.vs-sp small:empty { display: none; }
.vs-at { align-self: center; margin-top: 30px; font-size: 15px; color: var(--chalk-dim); }
.vs-call { margin: 12px 0 0; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--chalk); text-wrap: balance; }
@media (max-width: 380px) { .vs-pct { font-size: 52px; } .vs-name { font-size: 22px; } }
.chip { display: inline-block; width: 6px; height: 24px; border-radius: 2px; margin-right: 9px; vertical-align: -3px; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.hero .wrap { padding-top: 14px; padding-bottom: 18px; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; margin-left: -4px; padding-right: 8px; color: var(--chalk-dim); text-decoration: none; font-weight: 700; font-size: 15px; }
.back svg { width: 16px; height: 16px; }
.back:hover { color: var(--chalk); }
.pill { display: inline-flex; align-items: center; gap: 6px; margin: 0 10px 4px 0; padding: 1px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; line-height: 22px; vertical-align: 1px; background: rgba(255,255,255,.12); color: var(--chalk); }
.pill.live { background: #C8312B; color: #fff; }
.pill.final { background: var(--chalk); color: var(--board); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.hero-bar { position: relative; display: flex; height: 8px; margin: 12px 0 2px; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.22); }
.hero-bar i { display: block; height: 100%; }
.hero-bar::after { content: ""; position: absolute; left: calc(50% - 1px); top: 0; bottom: 0; width: 2px; background: var(--board); opacity: .9; }
.hero-meta { color: var(--chalk-dim); font-size: 15px; margin: 0 0 8px; }
.hero-venue { margin-top: -4px; font-size: 14px; }
.hero-cols { display: grid; grid-template-columns: 1fr 64px 64px; font-size: 14px; color: var(--chalk-dim); margin-top: 6px; }
.hero-cols span { text-align: right; }
.hero-row { display: grid; grid-template-columns: 70px 1fr 64px 64px; align-items: center; padding: 6px 0; }
.hero-row + .hero-row { border-top: 1px solid var(--board-line); }
.hero-row .abbr { font-size: 28px; }
.hero-row .team-name { color: var(--chalk); font-size: 18px; }
.hero-row .team-name small { color: var(--chalk-dim); }
.hero-row .team-name small.sp-sub { font-size: 14px; line-height: 1.3; white-space: pre-line; }
.hero-row .team-name small.sp-sub:empty { display: none; }
.sp-line[data-fmt="card"] { white-space: nowrap; }
.hero-row .big { font-family: var(--display); font-weight: 700; font-size: 44px; text-align: right; line-height: 1; }
.hero-row .pct { font-family: var(--display); font-weight: 600; font-size: 24px; text-align: right; color: var(--chalk-dim); }
.hero-row.fav .pct { color: var(--chalk); }
.hero-note { margin: 10px 0 0; font-size: 14px; color: var(--chalk-dim); }
.situation { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; margin: 12px 0 0; padding: 10px 12px; background: rgba(255,255,255,.06); border: 1px solid var(--board-line); border-radius: 8px; }
.situation > svg { display: block; width: 56px; height: 56px; }
.situation .zone { width: 76px; height: 97px; }
.situation .where { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--chalk); }
.situation .outs { display: inline-flex; gap: 4px; margin-left: 10px; vertical-align: middle; }
.situation .outs i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--chalk); display: inline-block; }
.situation .outs i.on { background: var(--lamp); border-color: var(--lamp); }
.situation .who { font-size: 15px; color: var(--chalk-dim); margin-top: 2px; }
.situation .who b { color: var(--chalk); font-weight: 700; }
.situation .at-bat { grid-column: 1 / -1; display: flex; gap: 12px; align-items: flex-start; padding-top: 8px; border-top: 1px solid var(--board-line); }
.situation .at-bat .pitches { color: var(--chalk-dim); font-size: 14px; line-height: 1.45; }
.situation .zone .k { stroke: var(--chalk-dim); }
.situation .zone .p { stroke: var(--board); }
.line-wrap { overflow-x: auto; margin-top: 14px; }
.line { border-collapse: separate; border-spacing: 3px; width: 100%; font-family: var(--display); }
.line th { font-weight: 500; font-size: 14px; color: var(--chalk-dim); text-align: center; padding: 0; }
.line th.team { text-align: left; font-weight: 700; font-size: 17px; color: var(--chalk); padding-right: 6px; }
.line td { background: var(--board-slot); border: 1px solid var(--board-line); border-radius: 2px; text-align: center; font-size: 19px; font-weight: 600; height: 34px; min-width: 24px; }
.line td.rh { background: var(--chalk); color: var(--board); border-color: var(--chalk); font-weight: 700; min-width: 30px; }
.line td.gap, .line th.gap { background: none; border: 0; min-width: 2px; width: 2px; padding: 0; }
/* Extra-inning games scroll sideways; the team and the R and H columns stay put. */
.line th.team, .line td.team { position: sticky; left: 0; z-index: 1; background: var(--board); }
.line th.rh, .line td.rh { position: sticky; z-index: 1; }
.line th.rh { background: var(--board); }
.line .rh.r { right: 36px; }
.line .rh.h { right: 0; }
.line.has-e .rh.r { right: 72px; }
.line.has-e .rh.h { right: 36px; }
.line .rh.e { right: 0; }
.line td.rh.r::after { content: ""; position: absolute; top: 0; bottom: 0; left: -8px; width: 8px; background: linear-gradient(to right, transparent, var(--board)); }
.line td.rh { position: sticky; }
.line td.scored { color: var(--lamp); }

/* Versions (other ways it could go) */
.versions { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; margin-bottom: 18px; }
.versions-cap { margin: 12px 0 -8px; font-size: 14px; color: var(--muted); }
.ver { flex: 0 0 auto; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 6px 12px; min-height: 48px; text-align: left; cursor: pointer; }
.ver b { display: block; font-size: 14px; }
.ver span { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--muted); }
.ver[aria-pressed="true"] { border-color: var(--board); box-shadow: inset 0 0 0 1px var(--board); }
.ver[aria-pressed="true"] span { color: var(--ink); }

/* Tabs */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
[id^="rp-detail-"], [id^="sheet-"], [id^="numbers-"] { scroll-margin-top: 62px; }   /* a tapped hitter's plan opens below the sticky tabs */
@media (min-width: 600px) { [id^="rp-detail-"], [id^="sheet-"], [id^="numbers-"] { scroll-margin-top: 62px; } }
.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 12px 12px 10px; min-height: 48px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--board); }
@media (max-width: 560px) {
  /* one row that scrolls sideways, like the market's game pages; the open tab is scrolled into view, and a fade at
     the right edge says there is more */
  .tabs::after { content: ""; position: absolute; top: 0; right: 0; bottom: 1px; width: 28px; background: linear-gradient(to right, transparent, var(--paper)); pointer-events: none; }
  .tabs .wrap { gap: 0; scrollbar-width: none; scroll-padding: 0 16px; }
  .tabs .wrap::-webkit-scrollbar { display: none; }
  .tab { padding: 12px 10px 9px; min-height: 46px; font-size: 16px; flex: 0 0 auto; }
}
.hero-call { margin: 10px 0 0; font-size: 16px; color: var(--chalk-dim); }
.hero-call b { color: var(--chalk); }
.hero-call.hit b { color: #8FD3A8; }
.hero-call.miss b { color: #F2A0A3; }
.panel { padding: 18px 0 40px; }
.panel[hidden] { display: none; }

/* Sections */
.sec { margin: 0 0 26px; }
.sec h2 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; margin: 0 0 4px; }
.sec .lede { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
.note { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

/* Key moments */
.wp { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 16px 8px 52px; }
.wp-plot { position: relative; height: 188px; margin-bottom: 30px; }
.wp-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wp-a { opacity: .17; }
.wp-grid { stroke: var(--rule-soft); stroke-width: 1; }
.wp-mid { stroke: var(--mid); stroke-width: 1.5; }
.wp-line { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.wp-team, .wp-y { position: absolute; right: calc(100% + 10px); font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1; }
.wp-team.wp-hi { top: 0; }
.wp-team.wp-lo { bottom: 0; }
.wp-y { top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; font-size: 15px; }
.wp-inn { position: absolute; top: calc(100% + 8px); transform: translateX(-50%); font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); }
.wp-inn:first-of-type { transform: none; }
.wp-mark, .wp-dot { position: absolute; display: block; border-radius: 50%; transform: translate(-50%, -50%); }
.wp-mark { width: 11px; height: 11px; background: var(--surface); border: 2.5px solid var(--ink); }
.wp-dot { width: 14px; height: 14px; box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--ink); }
.wp-cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-left: -36px; padding: 10px 0 6px; border-top: 1px solid var(--rule-soft); font-size: 15px; color: var(--muted); }
.wp-cap b { font-family: var(--display); font-size: 21px; font-weight: 700; text-align: right; }
@media (min-width: 720px) { .wp-plot { height: 236px; } }
.spray { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 8px 4px; }
.spray svg { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; }
.spray .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; padding: 6px 0 4px; font-size: 14px; color: var(--muted); }
.spray .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; border: 2px solid currentColor; }
.spray .legend i.f { background: currentColor; }
.spray .legend i.hr { background: var(--lamp); border-color: var(--ink); }
.swings { list-style: none; margin: 10px 0 0; padding: 0; }
h2.divide { margin: 26px 0 4px; padding-top: 18px; border-top: 2px solid var(--rule); color: var(--ink); }
.swings li { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--rule-soft); font-size: 16px; }
.swings + .note { margin-top: 6px; }
.panel > p.note + .sec, .panel > p.note + div { margin-top: 26px; }
.swings .inn { font-family: var(--display); font-weight: 600; color: var(--muted); }
.swings .d { font-family: var(--display); font-weight: 700; font-size: 18px; white-space: nowrap; }
.moments { list-style: none; margin: 0; padding: 0; }
.moments li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.moments .inn { font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--muted); }
.moments .txt { font-size: 16px; }
.moments .sc { display: block; font-family: var(--display); font-weight: 700; font-size: 16px; margin-top: 2px; }
.empty { color: var(--muted); padding: 8px 0; }

/* Performer cards */
.lineups { display: grid; gap: 14px; }
@media (min-width: 640px) { .lineups { grid-template-columns: 1fr 1fr; } }
.lineup { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
.lineup li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline; padding: 7px 12px; border-top: 1px solid var(--rule-soft); }
.lineup li:first-child { border-top: 0; }
.lineup .spot { color: var(--muted); font-size: 14px; }
.lineup .who { min-width: 0; }
.lineup .who small { display: block; color: var(--muted); font-size: 14px; white-space: normal; }
.lineup .line { font-family: var(--display); font-weight: 700; font-size: 19px; white-space: nowrap; }
.lineup li.sp { background: var(--tint); }
.lineup li.lineup-h { grid-template-columns: 1fr 64px 64px; align-items: center; border-top: 0; border-radius: 8px 8px 0 0; padding: 8px 12px; border-bottom: 3px solid var(--tc); }
.lineup li.lineup-h b { font-family: var(--display); font-size: 20px; color: var(--tc); }
.lineup li.lineup-h span { font-size: 14px; font-weight: 700; color: var(--muted); text-align: right; }
.lineup li.bat { grid-template-columns: 22px 1fr 64px 64px; align-items: center; }
.meter { position: relative; display: block; margin-left: 6px; padding-bottom: 6px; }
.meter::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; border-radius: 2px; background: var(--rule-soft); }
.meter i { position: absolute; left: 0; bottom: 0; height: 4px; border-radius: 2px; background: var(--tc); z-index: 1; }
.meter em { display: block; font-style: normal; font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 22px; text-align: right; }
.perf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.perf div { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; }
.perf b { display: block; font-size: 16px; }
.perf .stat { font-family: var(--display); font-size: 20px; font-weight: 600; }
.perf small { display: block; color: var(--muted); font-size: 14px; }

/* Box tables */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
.box { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.box th { font-size: 14px; font-weight: 700; color: var(--muted); text-align: right; padding: 8px 6px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
.box th[scope="row"] { border-bottom: 1px solid var(--rule-soft); }
.box tr.tot th { border-top: 1px solid var(--ink); border-bottom: 0; }
.box th:first-child, .box td:first-child { text-align: left; padding-left: 12px; }
.box th:last-child, .box td:last-child { padding-right: 12px; }
.box td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--rule-soft); font-family: var(--display); font-size: 18px; white-space: nowrap; }
.box td:first-child { font-family: var(--body); font-size: 16px; }
.box td .spot { display: inline-block; width: 18px; color: var(--muted); font-size: 14px; }
.box td.avg { color: var(--muted); }
.splits-wrap { max-width: 520px; }
.splits th[scope="row"] { text-align: left; font-weight: 700; color: var(--ink); border-bottom: 1px solid var(--rule-soft); font-family: var(--body); font-size: 16px; }
.box td .sub { display: block; color: var(--muted); font-size: 14px; font-family: var(--body); }
.box tr.tot td { font-weight: 700; border-top: 1px solid var(--ink); border-bottom: 0; }
.box tr.sub td:first-child { padding-left: 22px; color: var(--muted); }
.box-notes { font-size: 15px; margin: 8px 2px 0; }
.box-notes b { font-weight: 700; }
.team-h { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0 0 6px; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
.seg button { border: 0; background: var(--surface); padding: 8px 16px; min-height: 44px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--board); color: var(--chalk); }

/* Plays */
.half { margin: 0 0 18px; }
.half-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; position: sticky; top: 48px; background: var(--paper); padding: 8px 0 6px; border-bottom: 2px solid var(--ink); z-index: 2; }
.half-h b { font-family: var(--display); font-size: 20px; font-weight: 700; }
.half-h span { font-size: 14px; color: var(--muted); }
.pa { display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule-soft); align-items: start; }
.tag { font-family: var(--display); font-weight: 700; font-size: 15px; text-align: center; border-radius: 4px; padding: 1px 0; border: 1.5px solid var(--rule); color: var(--muted); }
.tag.hit { color: #fff; border-color: transparent; }
.tag.k { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tag.bb { border-color: var(--ink); color: var(--ink); }
.pa .what { font-size: 16px; }
.pa .meta { display: block; font-size: 14px; color: var(--muted); }
.pa .pitches { display: block; color: var(--muted); font-size: 14px; line-height: 1.4; margin-top: 2px; }
.pa .seq { display: flex; gap: 10px; align-items: flex-start; margin-top: 4px; }
.pa .seq .pitches { margin-top: 0; flex: 1; }
.zone { flex: none; width: 76px; height: 97px; display: block; }
.zone .k { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.zone .p { stroke: var(--surface); stroke-width: 1; }
.zone .n { font: 700 7.5px var(--body); fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pa .runs { font-family: var(--display); font-weight: 700; font-size: 17px; white-space: nowrap; }
.change { font-size: 14px; color: var(--muted); padding: 8px 0 2px; font-style: italic; }

/* Our number against the market */
.edges { margin-top: 6px; }
.edge-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.edge-list a { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; text-decoration: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px; min-height: 44px; }
.edge-list li.big a { border-left: 4px solid var(--lamp); }
.edge-list span small { display: block; color: var(--muted); font-size: 14px; font-family: var(--body); font-weight: 400; }
.edge-list .eg-game { grid-column: 1 / -1; font-family: var(--display); font-weight: 700; font-size: 19px; }
.edge-list .eg-ours, .edge-list .eg-mkt { font-family: var(--display); font-size: 18px; font-weight: 600; }
.edge-list .eg-gap { grid-column: 1 / -1; font-size: 15px; color: var(--muted); }
.edge-list li.big .eg-gap { color: var(--ink); }
.edge-list .eg-gap b { font-family: var(--display); font-size: 18px; }
@media (min-width: 720px) { .edge-list a { grid-template-columns: 1.1fr 1fr 1.4fr 1.2fr; align-items: end; } .edge-list .eg-game, .edge-list .eg-gap { grid-column: auto; } }
@media (min-width: 1100px) { .edges { max-width: 1120px; } }

/* Postseason series */
.sr-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.sr { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px 12px; }
.sr-head { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; color: var(--muted); margin-bottom: 4px; }
.sr-head span:last-child { color: var(--ink); font-weight: 700; }
.sr-team { display: grid; grid-template-columns: 52px 1fr 40px 56px; align-items: baseline; gap: 6px; padding: 2px 0; }
.sr-team .abbr { font-family: var(--display); font-weight: 700; font-size: 20px; }
.sr-team .team-name { font-size: 16px; }
.sr-team .big { font-family: var(--display); font-size: 22px; font-weight: 700; text-align: right; }
.sr-team .pct { font-family: var(--display); font-size: 20px; font-weight: 600; text-align: right; color: var(--muted); }
.sr-team.fav .pct { color: var(--ink); font-weight: 700; }
.sr-team.out .abbr, .sr-team.out .team-name, .sr-team.out .big, .sr-team.out .pct { color: var(--muted); }
.sr-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0 6px; }
.sr-bar i { display: block; height: 100%; }
.sr-games { list-style: none; margin: 10px 0 0; padding: 0; }
.sr-games li { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; align-items: baseline; gap: 8px; font-size: 15px; padding: 7px 0; border-top: 1px solid var(--rule-soft); }
.sr-games li b { font-weight: 700; }
.sr-games li .sg-p { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.sr-games li.maybe { color: var(--muted); }
.sr-games li.live b::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--live); vertical-align: 2px; }
.sr-games li.done { color: var(--muted); }
.sr-games li > span:last-child { text-align: right; }
.sr-foot { margin: 8px 0 0; font-size: 15px; }
.hero-series { margin: 10px 0 0; font-size: 15px; }
.hero-series b { font-family: var(--display); font-size: 17px; }
@media (min-width: 720px) { .sr-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .series { max-width: 1120px; } }

/* Matchups grid */
.mu-wrap { position: relative; overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.mu { border-collapse: collapse; width: 100%; font-family: var(--display); }
.mu th, .mu td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--rule-soft); white-space: nowrap; }
.mu thead th { font-family: var(--body); font-size: 14px; font-weight: 700; vertical-align: bottom; border-bottom: 2px solid var(--ink); }
.mu thead th span { display: block; }
.mu thead th small { display: block; font-weight: 400; color: var(--muted); }
.mu td { font-size: 18px; font-weight: 600; min-width: 52px; }
.mu .mu-who { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; font-family: var(--body); font-size: 15px; font-weight: 700; padding-left: 12px; }
.mu .mu-who .spot { display: inline-block; width: 22px; color: var(--muted); font-weight: 400; }
.mu .mu-who small { color: var(--muted); font-weight: 400; }
.rp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; width: 100%; max-width: 230px; aspect-ratio: 1; }
.rp-grid i { display: block; border-radius: 3px; background: var(--surface); border: 1px solid transparent; position: relative; }
.rp-grid i.z { border-color: var(--ink); }
.rp-grid i.aim::after { content: ""; position: absolute; inset: 25%; border-radius: 50%; background: var(--ink); }
.rp-grid i.aim.take::after { background: transparent; border: 2px solid var(--ink); box-sizing: border-box; }
.rp-grid i.strike::after { content: ""; position: absolute; inset: 28%; border-radius: 2px; background: var(--ink); }
.rp-grid i.strike.weak::after { background: transparent; border: 2px solid var(--ink); box-sizing: border-box; }
.rp-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.pl-tools { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 14px; }
.pl-search { flex: 1 1 220px; max-width: 420px; min-height: 44px; font: inherit; font-size: 16px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.pl-team { flex: 0 1 220px; min-height: 44px; font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.pl-list { list-style: none; margin: 0 0 20px; padding: 0; }
.pl-list li { border-top: 1px solid var(--rule-soft); }
.pl-list a { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; padding: 8px 4px; text-decoration: none; color: inherit; }

.key { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.range-list { list-style: none; padding: 0; margin: 0; }
.range-list li { padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.range-list b { display: block; }
.range-list .r { font-family: var(--display); font-size: 19px; font-weight: 600; }
.range-list small { color: var(--muted); font-size: 14px; }
/* The forecast in plain words: headline, 100 games, what decides it */
.story { padding-top: 18px; }
.story-kicker { margin: 0 0 2px; font-size: 14px; font-weight: 700; color: var(--muted); }
.story-h { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1.05; margin: 0 0 8px; text-wrap: balance; }
.story-p { margin: 0 0 14px; font-size: 18px; line-height: 1.5; max-width: 60ch; }
.hundred { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; max-width: 520px; }
.hundred i { display: block; aspect-ratio: 1; border-radius: 3px; }
.away-bg { background: var(--away); }
.home-bg { background: var(--home); }
.hundred-key { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0 0; font-weight: 700; font-size: 15px; }
.hundred-key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.key-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.key-item { background: var(--surface); border: 1px solid var(--rule); border-left: 5px solid var(--side); border-radius: 12px; padding: 12px 14px; }
.key-q { margin: 0; font-weight: 700; font-size: 18px; line-height: 1.3; }
.key-q small { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
.key-who { margin: 8px 0 2px; font-size: 14px; color: var(--muted); }
.kb { display: grid; grid-template-columns: 92px minmax(0, 1fr) 48px; align-items: center; gap: 8px; min-height: 28px; }
.kb-l { font-size: 15px; }
.kb-t { height: 12px; border-radius: 6px; background: var(--rule-soft); overflow: hidden; }
.kb-t i { display: block; height: 100%; background: var(--side); }
.kb.no .kb-t i { background: var(--mid); }
.kb b { text-align: right; font-size: 17px; }
.ladders { display: flex; flex-wrap: wrap; gap: 0 16px; }
.seg.prop-fmt { margin: 4px 0 0; }
.ladder-wrap { margin-top: 8px; max-width: 360px; flex: 1 1 280px; min-width: 0; }
.box.props th, .box.props td { padding-left: 4px; padding-right: 4px; }
.box.props td { font-size: 16px; }
.box.props th:first-child, .box.props td:first-child { padding-left: 10px; }
.box.props td:first-child { font-size: 15px; }
.box.props th:last-child, .box.props td:last-child { padding-right: 10px; }
.bvp-t td, .bvp-t th { font-size: 16px; padding: 7px 5px; }
.bvp-t th .spot { display: inline-block; width: 18px; color: var(--muted); font-size: 14px; }
.props-rec th[scope=row] { text-align: left; font-family: var(--body); font-weight: 400; font-size: 15px; white-space: normal; }
.props-rec td { white-space: nowrap; }
.ts-t th[scope=row] { text-align: left; font-family: var(--body); font-weight: 400; font-size: 15px; white-space: normal; }
.ts-t td { font-size: 17px; vertical-align: baseline; padding: 7px 6px; }
.ts-t th[scope=row] { padding-top: 7px; padding-bottom: 7px; vertical-align: baseline; }
.ts-t td small { display: inline-block; width: 34px; margin-left: 4px; text-align: left; font-family: var(--body); font-size: 14px; color: var(--muted); font-weight: 400; }
.ts-t td.ts-win { font-weight: 700; }
.mm th[scope=row] { text-align: left; font-family: var(--body); font-weight: 700; font-size: 15px; white-space: normal; }
.mm th[scope=row] small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
.mm td { font-family: var(--body); font-size: 15px; text-align: right; white-space: nowrap; }
.mm td b { font-family: var(--display); font-size: 18px; }
.mm td small { display: block; color: var(--muted); font-size: 14px; }
.bvp-t th[scope=row] { text-align: left; font-family: var(--body); font-weight: 400; white-space: nowrap; }
.bvp-t td.bvp-none { text-align: left; color: var(--muted); font-family: var(--body); font-size: 15px; }
.bvp-t tr.bvp-tot th, .bvp-t tr.bvp-tot td { font-weight: 700; border-top: 2px solid var(--ink); }
.ladder td small { display: inline-block; min-width: 42px; margin-left: 6px; text-align: right; font-family: var(--body); font-size: 14px; color: var(--muted); }
.ladder th[scope=row] { text-align: left; padding-left: 12px; font-family: var(--display); font-size: 18px; color: var(--ink); font-weight: 600; border-bottom: 1px solid var(--rule-soft); }

/* How close */
.close-card { background: var(--surface); border: 1px solid var(--rule); border-left: 5px solid var(--lamp); border-radius: 0; padding: 12px 16px; }
.close-card ul { list-style: none; margin: 0; padding: 0; }
.close-card li { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 7px 0; border-bottom: 1px solid var(--rule-soft); font-size: 16px; }
.close-card li:last-child { border-bottom: 0; }
.mark { font-weight: 700; }
.mark.yes { color: var(--board); }
.mark.no { color: var(--bad); }
.mark.even { color: var(--muted); }
.proj-fold { margin-top: 26px; }
details.more.proj-fold > summary { font-family: var(--display); font-size: 21px; font-weight: 700; color: var(--ink); }

/* Track record */
.cal { list-style: none; margin: 0; padding: 0; }
.cal li { padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.cal-top { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; }
.cal-top span { color: var(--muted); font-size: 14px; }
.cal-bar { position: relative; height: 14px; margin: 6px 0 4px; background: var(--rule-soft); border-radius: 3px; }
.cal-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--board); border-radius: 3px; }
.cal-bar em { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1px; background: var(--lamp); border-radius: 2px; }
.cal-words { font-size: 15px; color: var(--muted); }
.board-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 1px; margin: 14px 0 22px; background: var(--board-line); border-radius: 12px; overflow: hidden; }
.board-stats div { background: var(--board); color: var(--chalk-dim); padding: 12px 14px; }
.board-stats b { display: block; font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--chalk); }
.board-stats span { font-size: 14px; }
.seasons { display: grid; gap: 12px; }
@media (min-width: 640px) { .seasons { grid-template-columns: 1fr 1fr; } }
.seasons th small { font-weight: 400; }
.seasons tr.you td { font-weight: 700; background: var(--good-tint); }
.ladder { list-style: none; padding: 0; margin: 0; }
.ladder li { display: grid; grid-template-columns: 118px 1fr 64px; gap: 10px; align-items: center; padding: 8px 0; }
.ladder li.you span:first-child { font-weight: 700; }
.ladder .bar { position: relative; height: 16px; background: var(--rule-soft); border-radius: 3px; overflow: hidden; }
.ladder .bar::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--rule-strong); }
.ladder .bar i { position: absolute; top: 0; bottom: 0; background: var(--mid); }
.ladder .bar i.pos { left: 50%; background: var(--board); }
.ladder .bar i.neg { right: 50%; background: var(--bad); }
.ladder .v { font-family: var(--display); font-weight: 700; font-size: 19px; text-align: right; }
.games-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.games-list li { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
.games-list .g-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.games-list .g-top b { font-family: var(--display); font-size: 20px; font-weight: 700; }
.games-list .g-top span { color: var(--muted); font-size: 15px; }
.games-list .final { font-family: var(--display); font-size: 19px; font-weight: 600; margin: 2px 0 8px; }
.games-list .calls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 560px) { .games-list .calls { grid-template-columns: repeat(2, minmax(0, 220px)); } }
.games-list .call { border: 1px solid var(--rule-soft); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.games-list .call small { display: block; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.games-list .call b { font-family: var(--display); font-size: 19px; font-weight: 700; }
.games-list .call.yes { border-color: var(--good); background: var(--good-tint); }
.games-list .call.yes b { color: var(--good); }
.games-list .call.no b { color: var(--bad); }
.empty-state { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; }
.empty-state h2 { margin-top: 0; }
.prose { max-width: 66ch; }
.prose h2 { font-family: var(--display); font-weight: 700; font-size: 24px; margin: 26px 0 6px; }
.luck { margin: 12px 0 8px; display: grid; gap: 14px; max-width: 560px; }
.luck h3 { font-family: var(--display); font-weight: 700; font-size: 19px; margin: 4px 0 -4px; }
.luck-row { display: grid; gap: 5px; }
.luck-top { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 12px; row-gap: 0; }
.luck-top span { color: var(--muted); font-variant-numeric: tabular-nums; }
.luck-track { position: relative; height: 10px; border-radius: 5px; background: var(--rule-soft); overflow: hidden; }
.luck-fill { position: absolute; left: 0; top: 0; bottom: 0; min-width: 4px; border-radius: 5px; background: var(--ink); }
.luck-axis { position: relative; height: 20px; font-size: 14px; color: var(--muted); }
.luck-axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.luck-axis span:first-child { transform: translateX(-30%); }
.luck-axis span:last-child { transform: translateX(-100%); }
.luck-track i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--surface); opacity: .8; }
.prose p, .prose li { margin: 0 0 8px; }
details.ver-hist { margin-top: 10px; }
details.ver-hist summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
footer { color: var(--muted); font-size: 14px; padding: 12px 0 28px; border-top: 1px solid var(--rule); }
.loading { padding: 40px 0; color: var(--muted); }

@media (min-width: 720px) {
  .page-head h1 { font-size: 40px; }
  .cards { grid-template-columns: 1fr 1fr; }
  .hero-row .big { font-size: 52px; }
}
@media (max-width: 520px) {
  .top .wrap { padding-top: 6px; }
  .nav { width: 100%; margin-left: -10px; }
}
@media (max-width: 380px) {
  .line td { font-size: 17px; min-width: 21px; }
}

/* Desktop: wider pages; the game header splits in two; summary, odds and record read in two columns. */
@media (min-width: 1000px) {
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 0 48px; align-items: start; }
  .hero-grid.pre { grid-template-columns: minmax(0, 1fr); max-width: 880px; margin: 0 auto; }
  .hero-grid.pre .vs-pct { font-size: 96px; }
  .hero-grid.pre .vs-name { font-size: 34px; }
  .hero-grid.pre .vs-call { font-size: 34px; text-align: center; }
  .hero-grid.pre .hero-meta, .hero-grid.pre .hero-series { text-align: center; }
  .hero-side .line-wrap { margin-top: 30px; }
}
@media (min-width: 1100px) {
  .wrap { max-width: 1120px; }
  .page-head p, .dstrip, .replay-note { max-width: 760px; }
  .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .panel.tab-summary, .panel.tab-odds { column-count: 2; column-gap: 48px; }
  .panel.tab-summary > *, .panel.tab-odds > * { break-inside: avoid; }
  .panel .wide, .panel h2.divide { column-span: all; }
  .record-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 48px; align-items: start; }
  .record-cols .seasons { grid-template-columns: 1fr; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 48px; align-items: start; }
  .hero-side { align-self: center; }
  .wide .swings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  .wide .swings li { grid-template-columns: 1fr auto; grid-template-areas: "inn d" "t t"; gap: 2px 10px; padding: 10px 14px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
  .wide .swings .inn { grid-area: inn; } .wide .swings .d { grid-area: d; } .wide .swings .t { grid-area: t; }
  .panel.tab-box, .panel.tab-plays { max-width: 880px; }
  .games-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .games-list .calls { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } .pill i { animation: none; } }
@media (prefers-color-scheme: dark) {
  .tab[aria-selected="true"] { border-bottom-color: var(--lamp); }
  .ver[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .mark.yes { color: var(--good); }
  .ladder .bar i.pos { background: var(--good); }
  .games-list .call.yes { border-color: var(--good); }
}
/* Paper: a game plan printed for the dugout. Light colors whatever the screen theme, no navigation or controls, the
   folds and the plan rows kept whole. */
@media print {
  :root { --paper: #FFFFFF; --surface: #FFFFFF; --ink: #000000; --muted: #444444; --rule: #BBBBBB; --rule-soft: #DDDDDD;
          --board: #FFFFFF; --board-slot: #F2F2F2; --board-line: #BBBBBB; --chalk: #000000; --chalk-dim: #444444; --hover: #FFFFFF; --tint: #FFFFFF; --good-tint: #F2F2F2; color-scheme: light; }
  body { background: #FFFFFF; color: #000000; font-size: 11pt; }
  header.top, .tabs, .back, .versions, .versions-cap, .seg, .hero-bar, .card-bar, .pl-tags { display: none !important; }
  .hero { background-image: none; border-bottom: 1px solid #000000; }
  .plan-row, .rp-card, .mu tr, .hz-card, .sp { break-inside: avoid; }
  .hz-sw, .hz-mk, .hz-svg, .sp-svg { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a { color: inherit; text-decoration: none; }
}
</style>

<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><i aria-hidden="true"></i>Baseball Research Lab</a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="games">Games</a>
      <a href="#/record" data-nav="record">Record</a>
      <a href="#/players" data-nav="players">Players</a>
      <a href="#/how" data-nav="how">How it works</a>
    </nav>
  </div>
</header>
<main id="app"><div class="wrap loading">Loading today's games.</div></main>
<script>/*DATA*/</script>
<script>
(function () {
  "use strict";
  var DATA_URL = "predictions.json";
  var D = null;
  var app = document.getElementById("app");
  var state = { variant: {}, boxSide: {}, playSide: {}, muMetric: "obp", rpMetric: "chase", rpPair: {}, rpCount: "all", rpFollow: {}, rpCloud: false, rpOpen: {}, hzMetric: "avg", hzFam: "all", hzHand: "", hzBat: "R", hzPMetric: "loc", hzSheetHand: "sp", hzView: "raw", ldHit: "slg", ldPit: "k", propOdds: false };
  var REPORTS = "https://raw.githubusercontent.com/AlecGreenblatt36/Pitcher-Research-Lab/brl-live-data/public/reports/";
  var TOTAL_TAUGHT = { sim: 0.32, line: 0.78, shift: -0.543, from: "2026-10-10" };   /* TOTALS-03: expected total taught by results, fixed cross-season weights */
  var RP = {};

  /* ---------- small helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pct(p) { return Math.round(p * 100) + "%"; }
  function ordinal(n) { var s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  var SUFFIX = /^(Jr\.?|Sr\.?|II|III|IV)$/;
  function lastName(full) {
    var p = String(full || "").trim().split(/\s+/);
    if (p.length > 2 && SUFFIX.test(p[p.length - 1])) return p[p.length - 2] + " " + p[p.length - 1];
    return p[p.length - 1] || "";
  }
  /* Last names, with a first initial when two players on the list share one. */
  function shortNames(list) {
    var counts = {}, out = {};
    list.forEach(function (x) { var l = lastName(x.name); counts[l] = (counts[l] || 0) + 1; });
    list.forEach(function (x) {
      var l = lastName(x.name), first = String(x.name || "").trim().split(/\s+/)[0] || "";
      out[String(x.player_id)] = counts[l] > 1 && first ? first.charAt(0) + ". " + l : l;
    });
    return out;
  }
  function nickname(team) {
    var m = /(Red Sox|White Sox|Blue Jays)$/.exec(team);
    if (m) return m[1];
    var p = String(team).split(" ");
    return p[p.length - 1];
  }
  function timeET(iso) {
    try { return new Date(iso).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" }); }
    catch (e) { return ""; }
  }
  /* Club colors (primary, and a darker or contrasting second color when the two primaries look alike). */
  var TEAM_COLORS = { AZ: ["#A71930", "#000000"], ARI: ["#A71930", "#000000"], ATL: ["#CE1141", "#13274F"], BAL: ["#DF4601", "#000000"], BOS: ["#BD3039", "#0C2340"],
    CHC: ["#0E3386", "#CC3433"], CWS: ["#27251F", "#5A5A5A"], CHW: ["#27251F", "#5A5A5A"], CIN: ["#C6011F", "#000000"], CLE: ["#00385D", "#E50022"], COL: ["#333366", "#000000"],
    DET: ["#0C2340", "#FA4616"], HOU: ["#002D62", "#EB6E1F"], KC: ["#004687", "#8C6A2F"], LAA: ["#BA0021", "#003263"], LAD: ["#005A9C", "#EF3E42"],
    MIA: ["#00A3E0", "#EF3340"], MIL: ["#12284B", "#B8860B"], MIN: ["#002B5C", "#D31145"], NYM: ["#002D72", "#FF5910"], NYY: ["#0C2340", "#5B6770"],
    ATH: ["#003831", "#A27E0F"], OAK: ["#003831", "#A27E0F"], PHI: ["#E81828", "#002D72"], PIT: ["#27251F", "#B88A00"], SD: ["#2F241D", "#B38B00"],
    SF: ["#FD5A1E", "#27251F"], SEA: ["#0C2C56", "#005C5C"], STL: ["#C41E3A", "#0C2340"], TB: ["#092C5C", "#4A7FB0"], TEX: ["#003278", "#C0111F"],
    TOR: ["#134A8E", "#E8291C"], WSH: ["#AB0003", "#14225A"], WSN: ["#AB0003", "#14225A"] };
  function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function colorGap(a, b) { var x = hexRgb(a), y = hexRgb(b); return Math.sqrt(Math.pow(x[0] - y[0], 2) + Math.pow(x[1] - y[1], 2) + Math.pow(x[2] - y[2], 2)); }
  function teamColors(f) {
    var a = TEAM_COLORS[(f.away && f.away.abbr) || ""] || ["#2E5C9A", "#2E5C9A"], h = TEAM_COLORS[(f.home && f.home.abbr) || ""] || ["#B42A30", "#B42A30"];
    var ca = a[0], ch = h[0];
    /* Two clubs too close in color: one wears its second color, whichever pairing reads apart best (the road club on a tie). */
    if (colorGap(ca, ch) < 120) { var g1 = colorGap(a[1], ch), g2 = colorGap(ca, h[1]); if (Math.max(g1, g2) >= 120) { if (g1 >= g2) ca = a[1]; else ch = h[1]; } }
    return NIGHT ? { away: lift(ca), home: lift(ch), awayT: lift(ca), homeT: lift(ch) } : { away: ca, home: ch, awayT: deepen(ca), homeT: deepen(ch) };
  }
  /* The style that carries a game's club colors: fills use the colors as they are, text a version dark enough to read. */
  function teamStyle(tc) { return "--away:" + tc.away + ";--home:" + tc.home + ";--away-t:" + (tc.awayT || tc.away) + ";--home-t:" + (tc.homeT || tc.home) + ";--away-d:" + shade(tc.away) + ";--home-d:" + shade(tc.home) + ";--away-b:" + shade(tc.away, 0.18) + ";--home-b:" + shade(tc.home, 0.18); }
  /* The game page's top band runs from the road club's color to the home club's: each darkened toward the night board
     until white text on it keeps a contrast of 7 to 1 or more. */
  function shade(hex, lum) {     /* lum 0.18: white text on it keeps 4.5 to 1 (small badges) */
    var rgb = hexRgb(hex), base = [11, 20, 36], t = 0, mix = function (t) { return rgb.map(function (v, i) { return v * (1 - t) + base[i] * t; }); };
    while (luminance(mix(t)) > (lum || 0.09) && t < 0.95) t += 0.05;
    return "#" + mix(t).map(function (v) { v = Math.round(v); return (v < 16 ? "0" : "") + v.toString(16); }).join("");
  }
  /* Night theme: club colors darker than a set brightness are mixed with white until they read on the dark field. */
  var NIGHT = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  function luminance(rgb) {
    var c = rgb.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

  var OTHER_CHECKS = [

    var rows = bins.map(function (b) { return { lo: b[0], hi: b[1], label: b[2], n: 0, p: 0, won: 0 }; }), months = {}, order = [];
    years.forEach(function (y) {

    var h = '<section class="sec"><h2>When we say 60%, do they win 60%?</h2><p class="lede">Every game of both seasons, grouped by how sure we were of the favorite. The dark bar is how often the favorite actually won; the tick is what we said.</p><ul class="cal">';

    order.forEach(function (k) {

    /* team by team for the latest season: wins next to what our pregame numbers added up to */

      tl.forEach(function (t) { var d = Math.round(t.won - t.exp); h += "<tr><td>" + esc(nickname(t.name || t.ab)) + "</td><td>" + t.n + "</td><td>" + t.won + "</td><td>" + Math.round(t.exp) + "</td><td>" + (d > 0 ? "+" + d : d < 0 ? "\u2212" + (-d) : "0") + "</td></tr>"; });
