<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4A37" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#143326" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Baseball Research Lab</title>
<style>
/*FONTS*/
:root {
  --paper: #F3F5F2;
  --surface: #FFFFFF;
  --ink: #17231C;
  --muted: #56645B;
  --rule: #D3DAD4;
  --rule-soft: #E6EBE7;
  --board: #1F4A37;
  --board-slot: #163828;
  --board-line: #2F6049;
  --chalk: #F5F3EA;
  --chalk-dim: #B9C9BF;
  --away: #2E5C9A;
  --home: #B42A30;
  --lamp: #F0B23A;
  --good: #1F6B47;
  --bad: #B42A30;
  --live: #C8312B;
  --hover: #E7ECE8;
  --rule-strong: #A9B6AD;
  --mid: #9AA8A0;
  --tint: #F6F8F5;
  --good-tint: #EAF1EC;
  --grass: #E6EEE4;
  --dirt: #E9DFC7;
  --field-line: #FFFFFF;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
/* Night: the same ballpark green, a dark field around it; team colors are lifted in script (teamColors) so dark
   club colors stay readable. */
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0D1511; --surface: #141F19; --ink: #E4EBE6; --muted: #9AACA0; --rule: #2A3A31; --rule-soft: #1D2A23;
    --board: #173B2C; --board-slot: #0F2A1E; --board-line: #2A5541; --good: #4DB184; --bad: #E2595F;
    --hover: #1B2821; --rule-strong: #3F5348; --mid: #5F7468; --tint: #18241E; --good-tint: #163326;
    --grass: #1A2A20; --dirt: #2B271E; --field-line: #3B4B41;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Top bar */
.top { background: var(--board); color: var(--chalk); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; column-gap: 12px; min-height: 56px; }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .01em; color: var(--chalk); text-decoration: none; white-space: nowrap; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 0 3px rgba(240,178,58,.18); }
.nav { display: flex; gap: 2px; }
.nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; text-decoration: none; font-weight: 700; font-size: 15px; color: var(--chalk-dim); border-radius: 8px; }
.nav a:hover { color: var(--chalk); }
.nav a[aria-current="page"] { color: var(--chalk); background: rgba(255,255,255,.09); box-shadow: inset 0 -3px 0 var(--lamp); }

/* Slate */
.page-head { padding: 22px 0 6px; }
.page-head h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.05; margin: 0; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.dstrip { display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px 44px; align-items: center; gap: 4px; margin: 14px 0 2px; }
.dstrip-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.dstrip-day { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 54px; border-radius: 12px; text-decoration: none; color: var(--muted); }
.dstrip-day small { font-size: 14px; font-weight: 700; line-height: 1.15; }
.dstrip-day.today b::after { content: ""; display: block; width: 6px; height: 6px; margin: 2px auto 0; border-radius: 50%; background: var(--lamp); }
.dstrip-day.today { padding-top: 4px; }
.dstrip-day b { font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.05; color: var(--ink); }
.dstrip-day:hover { background: var(--hover); }
.dstrip-day[aria-current="date"] { background: var(--board); color: var(--chalk-dim); }
.dstrip-day[aria-current="date"] b { color: var(--chalk); }
.dstrip-step { display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 10px; color: var(--ink); }
.dstrip-step svg { width: 16px; height: 16px; }
.dstrip-step:hover { background: var(--hover); }
.dstrip-step[aria-disabled="true"] { opacity: .28; pointer-events: none; }
.dstrip-pick { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; }
.dstrip-pick svg { width: 20px; height: 20px; }
.dstrip-pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.replay-note { font-size: 14px; color: var(--muted); margin: 12px 0 0; padding: 9px 12px; border-left: 3px solid var(--lamp); background: var(--surface); border-radius: 0 8px 8px 0; }
.cards { list-style: none; margin: 14px 0 32px; padding: 0; display: grid; gap: 12px; }
.card { display: block; position: relative; overflow: hidden; text-decoration: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 16px 16px; }
.card:hover { border-color: var(--rule-strong); }
.card-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; display: flex; }
.card-bar i { display: block; height: 100%; }
.card-top { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--muted); margin-bottom: 6px; }
.card-ctx { font-size: 14px; color: var(--muted); margin: -2px 0 8px; }
.team-name .rec { font-size: 14px; color: var(--muted); font-weight: 500; }
.state { font-weight: 700; font-size: 14px; }
.state.live { color: var(--live); }
.state.final { color: var(--ink); }
.state .mini { display: inline-block; vertical-align: -3px; margin-right: 6px; width: 18px; height: 16px; }
.state .mini rect { fill: none; stroke: currentColor; stroke-width: 1.4; }
.state .mini rect.on { fill: currentColor; }
.cols { display: grid; grid-template-columns: 1fr 56px 56px; align-items: end; font-size: 14px; color: var(--muted); }
.cols span { text-align: right; }
.team-row { display: grid; grid-template-columns: 50px 1fr 56px 56px; align-items: center; padding: 7px 0; }
.team-row.lost .team-name, .team-row.lost .big { color: var(--muted); }
.team-row.lost .big { font-weight: 600; }
.team-row + .team-row { border-top: 1px solid var(--rule-soft); }
.abbr { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .01em; }
.team-name { font-weight: 700; font-size: 17px; line-height: 1.2; }
.team-name small { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
.team-row .big { font-family: var(--display); font-weight: 700; font-size: 30px; text-align: right; line-height: 1; }
.team-row .pct { font-family: var(--display); font-weight: 600; font-size: 22px; text-align: right; color: var(--muted); }
.team-row.fav .pct { color: var(--ink); }
.away-c { color: var(--away); }
.home-c { color: var(--home); }
.card-foot { margin-top: 8px; font-size: 14px; color: var(--muted); }
.card-foot.hit::before, .card-foot.miss::before { display: inline-block; width: 16px; font-weight: 700; }
.card-foot.hit::before { content: "\2713"; color: var(--good); }
.card-foot.miss::before { content: "\2717"; color: var(--bad); }
.lamp { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--lamp); margin-right: 6px; vertical-align: 1px; }

/* Game hero */
.hero { background-color: var(--board); background-image: repeating-linear-gradient(180deg, rgba(255,255,255,.028) 0 1px, transparent 1px 38px); color: var(--chalk); }
.chip { display: inline-block; width: 6px; height: 24px; border-radius: 2px; margin-right: 9px; vertical-align: -3px; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.hero .wrap { padding-top: 14px; padding-bottom: 18px; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; margin-left: -4px; padding-right: 8px; color: var(--chalk-dim); text-decoration: none; font-weight: 700; font-size: 15px; }
.back svg { width: 16px; height: 16px; }
.back:hover { color: var(--chalk); }
.pill { display: inline-flex; align-items: center; gap: 6px; margin: 0 10px 4px 0; padding: 1px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; line-height: 22px; vertical-align: 1px; background: rgba(255,255,255,.12); color: var(--chalk); }
.pill.live { background: var(--live); color: #fff; }
.pill.final { background: var(--chalk); color: var(--board); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.hero-bar { position: relative; display: flex; height: 8px; margin: 12px 0 2px; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.22); }
.hero-bar i { display: block; height: 100%; }
.hero-bar::after { content: ""; position: absolute; left: calc(50% - 1px); top: 0; bottom: 0; width: 2px; background: var(--board); opacity: .9; }
.hero-meta { color: var(--chalk-dim); font-size: 15px; margin: 0 0 8px; }
.hero-venue { margin-top: -4px; font-size: 14px; }
.hero-cols { display: grid; grid-template-columns: 1fr 64px 64px; font-size: 14px; color: var(--chalk-dim); margin-top: 6px; }
.hero-cols span { text-align: right; }
.hero-row { display: grid; grid-template-columns: 70px 1fr 64px 64px; align-items: center; padding: 6px 0; }
.hero-row + .hero-row { border-top: 1px solid var(--board-line); }
.hero-row .abbr { font-size: 28px; }
.hero-row .team-name { color: var(--chalk); font-size: 18px; }
.hero-row .team-name small { color: var(--chalk-dim); }
.hero-row .big { font-family: var(--display); font-weight: 700; font-size: 44px; text-align: right; line-height: 1; }
.hero-row .pct { font-family: var(--display); font-weight: 600; font-size: 24px; text-align: right; color: var(--chalk-dim); }
.hero-row.fav .pct { color: var(--chalk); }
.hero-note { margin: 10px 0 0; font-size: 14px; color: var(--chalk-dim); }
.situation { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; margin: 12px 0 0; padding: 10px 12px; background: rgba(255,255,255,.06); border: 1px solid var(--board-line); border-radius: 8px; }
.situation > svg { display: block; width: 56px; height: 56px; }
.situation .zone { width: 76px; height: 97px; }
.situation .where { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--chalk); }
.situation .outs { display: inline-flex; gap: 4px; margin-left: 10px; vertical-align: middle; }
.situation .outs i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--chalk); display: inline-block; }
.situation .outs i.on { background: var(--lamp); border-color: var(--lamp); }
.situation .who { font-size: 15px; color: var(--chalk-dim); margin-top: 2px; }
.situation .who b { color: var(--chalk); font-weight: 700; }
.situation .at-bat { grid-column: 1 / -1; display: flex; gap: 12px; align-items: flex-start; padding-top: 8px; border-top: 1px solid var(--board-line); }
.situation .at-bat .pitches { color: var(--chalk-dim); font-size: 14px; line-height: 1.45; }
.situation .zone .k { stroke: var(--chalk-dim); }
.situation .zone .p { stroke: var(--board); }
.line-wrap { overflow-x: auto; margin-top: 14px; }
.line { border-collapse: separate; border-spacing: 3px; width: 100%; font-family: var(--display); }
.line th { font-weight: 500; font-size: 14px; color: var(--chalk-dim); text-align: center; padding: 0; }
.line th.team { text-align: left; font-weight: 700; font-size: 17px; color: var(--chalk); padding-right: 6px; }
.line td { background: var(--board-slot); border: 1px solid var(--board-line); border-radius: 2px; text-align: center; font-size: 19px; font-weight: 600; height: 34px; min-width: 24px; }
.line td.rh { background: var(--chalk); color: var(--board); border-color: var(--chalk); font-weight: 700; min-width: 30px; }
.line td.gap, .line th.gap { background: none; border: 0; min-width: 2px; width: 2px; padding: 0; }
/* Extra-inning games scroll sideways; the team and the R and H columns stay put. */
.line th.team, .line td.team { position: sticky; left: 0; z-index: 1; background: var(--board); }
.line th.rh, .line td.rh { position: sticky; z-index: 1; }
.line th.rh { background: var(--board); }
.line .rh.r { right: 36px; }
.line .rh.h { right: 0; }
.line td.rh.r::after { content: ""; position: absolute; top: 0; bottom: 0; left: -8px; width: 8px; background: linear-gradient(to right, rgba(31,74,55,0), var(--board)); }
.line td.rh { position: sticky; }
.line td.scored { color: var(--lamp); }

/* Versions (other ways it could go) */
.versions { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; }
.versions-cap { margin: 12px 0 -8px; font-size: 14px; color: var(--muted); }
.ver { flex: 0 0 auto; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 6px 12px; min-height: 48px; text-align: left; cursor: pointer; }
.ver b { display: block; font-size: 14px; }
.ver span { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--muted); }
.ver[aria-pressed="true"] { border-color: var(--board); box-shadow: inset 0 0 0 1px var(--board); }
.ver[aria-pressed="true"] span { color: var(--ink); }

/* Tabs */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 12px 12px 10px; min-height: 48px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--board); }
.panel { padding: 18px 0 40px; }
.panel[hidden] { display: none; }

/* Sections */
.sec { margin: 0 0 26px; }
.sec h2 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; margin: 0 0 4px; }
.sec .lede { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
.note { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

/* Key moments */
.wp { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 16px 8px 52px; }
.wp-plot { position: relative; height: 188px; margin-bottom: 30px; }
.wp-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wp-a { opacity: .17; }
.wp-grid { stroke: var(--rule-soft); stroke-width: 1; }
.wp-mid { stroke: var(--mid); stroke-width: 1.5; }
.wp-line { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.wp-team, .wp-y { position: absolute; right: calc(100% + 10px); font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1; }
.wp-team.wp-hi { top: 0; }
.wp-team.wp-lo { bottom: 0; }
.wp-y { top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; font-size: 15px; }
.wp-inn { position: absolute; top: calc(100% + 8px); transform: translateX(-50%); font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); }
.wp-inn:first-of-type { transform: none; }
.wp-mark, .wp-dot { position: absolute; display: block; border-radius: 50%; transform: translate(-50%, -50%); }
.wp-mark { width: 11px; height: 11px; background: var(--surface); border: 2.5px solid var(--ink); }
.wp-dot { width: 14px; height: 14px; box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--ink); }
.wp-cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-left: -36px; padding: 10px 0 6px; border-top: 1px solid var(--rule-soft); font-size: 15px; color: var(--muted); }
.wp-cap b { font-family: var(--display); font-size: 21px; font-weight: 700; text-align: right; }
@media (min-width: 720px) { .wp-plot { height: 236px; } }
.spray { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 8px 4px; }
.spray svg { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; }
.spray .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; padding: 6px 0 4px; font-size: 14px; color: var(--muted); }
.spray .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; border: 2px solid currentColor; }
.spray .legend i.f { background: currentColor; }
.spray .legend i.hr { background: var(--lamp); border-color: var(--ink); }
.swings { list-style: none; margin: 10px 0 0; padding: 0; }
h2.divide { margin: 26px 0 4px; padding-top: 18px; border-top: 2px solid var(--rule); color: var(--muted); }
.swings li { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--rule-soft); font-size: 16px; }
.swings + .note { margin-top: 6px; }
.swings .inn { font-family: var(--display); font-weight: 600; color: var(--muted); }
.swings .d { font-family: var(--display); font-weight: 700; font-size: 18px; white-space: nowrap; }
.moments { list-style: none; margin: 0; padding: 0; }
.moments li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.moments .inn { font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--muted); }
.moments .txt { font-size: 16px; }
.moments .sc { display: block; font-family: var(--display); font-weight: 700; font-size: 16px; margin-top: 2px; }
.empty { color: var(--muted); padding: 8px 0; }

/* Performer cards */
.lineups { display: grid; gap: 14px; }
@media (min-width: 640px) { .lineups { grid-template-columns: 1fr 1fr; } }
.lineup { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
.lineup li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline; padding: 7px 12px; border-top: 1px solid var(--rule-soft); }
.lineup li:first-child { border-top: 0; }
.lineup .spot { color: var(--muted); font-size: 14px; }
.lineup .who { min-width: 0; }
.lineup .who small { display: block; color: var(--muted); font-size: 14px; white-space: normal; }
.lineup .line { font-family: var(--display); font-weight: 700; font-size: 19px; white-space: nowrap; }
.lineup li.sp { background: var(--tint); }
.lineup li.lineup-h { grid-template-columns: 1fr 64px 64px; align-items: center; border-top: 0; border-radius: 8px 8px 0 0; padding: 8px 12px; border-bottom: 3px solid var(--tc); }
.lineup li.lineup-h b { font-family: var(--display); font-size: 20px; color: var(--tc); }
.lineup li.lineup-h span { font-size: 14px; font-weight: 700; color: var(--muted); text-align: right; }
.lineup li.bat { grid-template-columns: 22px 1fr 64px 64px; align-items: center; }
.meter { position: relative; display: block; height: 22px; border-radius: 4px; background: var(--rule-soft); overflow: hidden; margin-left: 6px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tc); opacity: .22; }
.meter em { position: relative; display: block; font-style: normal; font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 22px; text-align: right; padding-right: 6px; }
.perf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.perf div { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; }
.perf b { display: block; font-size: 16px; }
.perf .stat { font-family: var(--display); font-size: 20px; font-weight: 600; }
.perf small { display: block; color: var(--muted); font-size: 14px; }

/* Box tables */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
.box { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.box th { font-size: 14px; font-weight: 700; color: var(--muted); text-align: right; padding: 8px 6px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
.box th:first-child, .box td:first-child { text-align: left; padding-left: 12px; }
.box th:last-child, .box td:last-child { padding-right: 12px; }
.box td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--rule-soft); font-family: var(--display); font-size: 18px; white-space: nowrap; }
.box td:first-child { font-family: var(--body); font-size: 16px; }
.box td .spot { display: inline-block; width: 18px; color: var(--muted); font-size: 14px; }
.box td .sub { display: block; color: var(--muted); font-size: 14px; font-family: var(--body); }
.box tr.tot td { font-weight: 700; border-top: 1px solid var(--ink); border-bottom: 0; }
.box-notes { font-size: 15px; margin: 8px 2px 0; }
.box-notes b { font-weight: 700; }

<script>
(function () {

  var SUFFIX = /^(Jr\.?|Sr\.?|II|III|IV)$/;
  function lastName(full) {
    var p = String(full || "").trim().split(/\s+/);
    if (p.length > 2 && SUFFIX.test(p[p.length - 1])) return p[p.length - 2] + " " + p[p.length - 1];

  /* Last names, with a first initial when two players on the list share one. */
  function shortNames(list) {

  }

  }

  }

  var TEAM_COLORS = { AZ: ["#A71930", "#000000"], ARI: ["#A71930", "#000000"], ATL: ["#CE1141", "#13274F"], BAL: ["#DF4601", "#000000"], BOS: ["#BD3039", "#0C2340"],
    CHC: ["#0E3386", "#CC3433"], CWS: ["#27251F", "#5A5A5A"], CHW: ["#27251F", "#5A5A5A"], CIN: ["#C6011F", "#000000"], CLE: ["#00385D", "#E50022"], COL: ["#333366", "#000000"],
    DET: ["#0C2340", "#FA4616"], HOU: ["#002D62", "#EB6E1F"], KC: ["#004687", "#8C6A2F"], LAA: ["#BA0021", "#003263"], LAD: ["#005A9C", "#EF3E42"],
    MIA: ["#00A3E0", "#EF3340"], MIL: ["#12284B", "#B8860B"], MIN: ["#002B5C", "#D31145"], NYM: ["#002D72", "#FF5910"], NYY: ["#0C2340", "#5B6770"],
    ATH: ["#003831", "#A27E0F"], OAK: ["#003831", "#A27E0F"], PHI: ["#E81828", "#002D72"], PIT: ["#27251F", "#B88A00"], SD: ["#2F241D", "#B38B00"],

  function teamColors(f) {
    var a = TEAM_COLORS[(f.away && f.away.abbr) || ""] || ["#2E5C9A", "#2E5C9A"], h = TEAM_COLORS[(f.home && f.home.abbr) || ""] || ["#B42A30", "#B42A30"];

        call("Headline", g.p_blend) + (g.p_ours != null && Math.abs(g.p_ours - g.p_blend) >= 0.005 ? call("Our model", g.p_ours) : "") + call("Simulator", g.p_sim) + call("Team model", g.p_team) + call("Market", g.p_market) + "</div></li>";
    });
    h += '</ol><p class="note">Green means the favored team won.</p></section>';
    app.innerHTML = h + "</div>";
  }

  /* ---------- how it works ---------- */
  function renderHow() {
    var fx = latestForecasts(), any = fx[Object.keys(fx)[0]] || {}, h = '<div class="wrap"><div class="page-head"><h1>How it works</h1></div><div class="prose">';
    h += "<h2>One game, ten thousand times</h2><p>Before each game the engine plays it out ten thousand times, one plate appearance at a time. Every plate appearance uses the real hitter, the real pitcher and their history up to the day before. The simulator's win chance is the share of those games each team won.</p>";
    var physicsModel = Object.keys(fx).some(function (k) { return /physics/i.test(String(fx[k].model || "")); });
    if (physicsModel) {
      h += "<h2>What the model knows about each player</h2><p>Each plate appearance is scored by a seven-outcome model fitted on 2023 and 2024, tuned on 2025 and tested on the whole 2026 season before it was used. Beyond a player's results (and his splits, recent form, park and age), it reads the official pitch physics of every prior game: for hitters, exit velocity, launch angle, hard-hit and barrel rates, the expected run value of the way they hit the ball, swing, whiff, chase and in-zone contact rates, and how the last 30 days differ from their norm; for pitchers, fastball velocity and how the last outing compared with it, spin and movement, whiff, chase, zone and called-strike-plus-whiff rates, contact quality and ground-ball share allowed, and the same 30-day form. On the 2026 holdout this cut the model's error against the results-only version with the whole season held out.</p>";
    }
    h += "<h2>The headline number</h2><p>The win chance on each card is the best number we can give before first pitch. It starts from our own model, which combines the simulator with a team-strength model (runs scored and allowed, home field, recent form, and the starting pitchers: each starter's strikeout, walk and home-run rates against his team's usual rotation, weighted by how deep he usually goes). The weights were taught by the betting market: instead of fitting them to wins and losses, which are noisy, they were fitted to the market's closing lines on 4,140 regular-season games from 2025 and 2026, a far more precise target, then checked on real results from a season the fit never saw. Our model never sees a line when it makes a forecast.</p>";
    h += "<p>Once the market's pregame line is posted, the headline combines the two on the log-odds scale, " + (weightsText() || "60% market, 40% our model") + ". The market's line is the average of up to eight sportsbooks when they can be read (DraftKings alone otherwise). In replays of 2025 and 2026, which were also used to choose the mix, it came out slightly more accurate than the closing line alone; the margin is within the noise of two seasons, so the real test is the games played from here on. Before a line is posted the headline is our model alone. The Odds tab shows every part and the Record page scores each one separately, including the games where our model and the market disagree.</p>";
    h += "<p>What line movement does and does not show: when our model has differed from the opening line, the line has moved toward our number by first pitch about 7 times in 10 (replays of 2025 and 2026, each season checked with a model taught on the other). Our final number includes the posted lineups, which the opening line had not priced, so the replays were run again with only what was known at the open (the previous game's lineup and the probable starters): the line still moved toward our number 68% of the time in 2025 and 73% in 2026. The posted lineups explain only a few points of the figure. Line movement is not profit; we do not claim that betting on our number pays.</p>";
    h += "<p>Changes to the recipe take effect from a stated time and never rewrite a game that has started. Through October 7, 2026 the headline was a plain average of the simulator and the team model.</p>";
    h += "<h2>The matchup report</h2><p>Every game has a Report tab: each hitter against the pitchers he will face, built only from pitches thrown before that day. The idea behind it is that a hitter decides to swing on where the pitch appears to be headed about 260 milliseconds before it reaches the plate, not on where it ends up; his swing map read at that moment predicts his swings and takes about 8% better than the usual heat map, and it predicts how much he will chase against a specific pitcher's arsenal. Measured fairly against a gradient-boosted model given the same pitch inputs, the hitter-specific part of that still adds about 3.6 nats per 1,000 decisions on later months the models were not fitted on. We also measured that pitchers do not aim at these hitter-specific spots on average. Under the assumptions that this makes where a pitch lands on a hitter's map as good as chance, that command scatters pitches by about 0.6 ft, and that hitters do not adapt much, aiming at those spots is worth an estimated 30 to 45 runs over a team's season from outside pitches alone: about 44 when each spot is priced by the engine's own pieces (how often he swings there, misses, fouls off or puts the ball in play, and what each does to the count), about 29 when the same kind of choice is priced by what actually happened on such pitches. Strikes placed where a hitter lets them go or swings to little effect add about 23 more by the same pricing. That is estimated policy potential, not observed runs saved; the months it was measured on were looked at more than once while the pricing was corrected, and the method was tested in synthetic seasons with known answers before these figures replaced an earlier one of 32 that overstated what its own choices were worth. The report names the spots for each pitch family, the extra chases, and the strikeout and walk changes against the league pairing.</p>"
      + "<p>Finished games are graded on the Report tab: how many outside pitches actually went to the recommended spots against the pitcher's usual rate, and how the hitters' chases compared with what the league rates and their own maps expected. Past games can be opened the same way: each backfilled report is a retrospective reconstruction, with the maps fitted only on pitches thrown before that month began but with a method chosen in October 2026, so a coach can judge the report against what happened without hindsight in the data, though not without hindsight in the method. The grade keeps three things apart: how well the chase predictions held (prediction quality), whether pitches landed where the report pointed (location alignment, which is not proof the pitcher intended it), and what following the plan would have been worth (policy value, which is not measured by a grade). The research behind it, with every test and its result, is in the repository's ledger.</p>";
    var adj = {};
    Object.keys(D.box_scores || {}).forEach(function (id) { var b = D.box_scores[id]; if (b.date === D.date && b.adjustments) b.adjustments.forEach(function (a) { adj[a] = 1; }); });
    if (Object.keys(adj).length) {
      h += "<h2>Adjustments at simulation time</h2><p>The plate appearance model is fitted once and does not change during a season. These are layered on it when games are simulated, each measured on prior games before being switched on.</p><ul>";
      if (Object.keys(adj).some(function (a) { return /context offsets/.test(a); })) h += "<li><b>First inning.</b> Visiting hitters do worse in the top of the first (more strikeouts, fewer extra-base hits) and home hitters do better in the bottom of the first. The frozen model has no such effect, so fixed offsets measured on prior seasons are applied by inning and batting side. The same offsets set the overall level of strikeouts, walks and home runs: measured on the model as the simulator actually runs it, they raised strikeouts about 4% and brought starting pitchers' projected strikeouts to the real average in both 2025 and 2026.</li>";
      if (Object.keys(adj).some(function (a) { return /postseason/.test(a); })) h += "<li><b>Postseason starters.</b> In the Wild Card, Division and League Championship rounds, starters face about 87% of the batters they face in a regular-season start and a quarter of starts end before the lineup comes around twice (measured on 294 postseason starts, 2023 to 2026). The fitted starter hazard is driven by the expected batters faced, so that expectation is scaled down in those rounds; the World Series matches the regular season and is left alone.</li>";
      if (Object.keys(adj).some(function (a) { return /run environment/.test(a); })) h += "<li><b>Weather and ballpark.</b> The plate appearance model knows the park only through the home team and knows nothing about weather. Each game's plate appearances are adjusted for the temperature at first pitch (about 8% more home runs per 10 degrees), a closed roof, day games, the wind at Wrigley Field, and how each ballpark has played beyond what the model expects, measured on 2025 and 2026 plate appearances and checked on the season the fit did not see. When the weather is not posted yet, the park's usual temperature for the month stands in.</li>";
      if (Object.keys(adj).some(function (a) { return /team offsets/.test(a); })) h += "<li><b>Team effects.</b> The plate appearance model rates hitters and pitchers one at a time. Summed by team, its misses keep a part that carries from one month to the next: defenses that turn more balls in play into outs, staffs and catchers that get more strikeouts than their pitchers' own rates, lineups that outrun or trail their hitters' history. Each team's batting and fielding offsets come from its earlier games, pulled toward zero and fading with a 120-day half-life, and are centered on the league, so they move teams against each other without changing the league's scoring level. Measured on full replays of 2025 and 2026, they improved the win chances in both seasons and brought run totals closer to how each ballpark actually played.</li>";
      if (Object.keys(adj).some(function (a) { return /stolen bases/.test(a); })) h += "<li><b>Base running.</b> Every runner moves at his own Statcast sprint speed, and runners steal second and third at their own rates, adjusted for how often the pitcher on the mound is run on and how often runners succeed against him. A caught stealing is an out for that pitcher. Measured on the full 2026 season, it brought the simulator closer to both the results and the betting market.</li>";
      if (Object.keys(adj).some(function (a) { return /play-by-play/.test(a); })) h += "<li><b>Runners after each play.</b> After every plate appearance, the runners move the way they do in MLB, drawn from every play of the 2023 to 2026 seasons in the official play-by-play for the same result, bases and outs: how often an out with a runner on first becomes a double play (23% with fewer than two out), how often the runner on third scores on an out with fewer than two out (54%), how often a runner scores from second on a single or from first on a double. Faster runners take the extra base more often and faster batters beat out more double plays, by the amounts measured on the same plays. Replayed on the full 2025 and 2026 seasons, it brought the simulated batters per game to the real number, and the win chances came out slightly more accurate in both seasons.</li>";
      if (Object.keys(adj).some(function (a) { return /talent noise/.test(a); })) h += "<li><b>Talent uncertainty.</b> Nobody knows a player's true level exactly. Each simulated game draws slightly different levels for every hitter and pitcher, sized by how much history they have, so the ranges shown are honest about what is unknown.</li>";
      h += "</ul>";
    }
    h += "<h2>The projected game</h2><p>The projected game is one of the ten thousand simulated games: the one closest to the middle on team runs, team hits and each starter's innings and strikeouts, with the favorite winning in nine innings. It reads like a real box score, but it is one likely version of the night, not a promise. High-scoring, low-scoring and upset versions show the range.</p>";
    h += "<h2>The real game</h2><p>While a game is on, the page reads MLB's public feed itself every 15 seconds, so the score, the situation and the plays are current without waiting for a saved run. In-game and after the final, the tabs show the real game from the official play-by-play, every plate appearance with its pitches (type, speed, result and where each one crossed the plate, from the catcher's view) and where the ball went, beside the projected one. The win chance chart reads each play's starting situation (inning, outs, runners, score) against the same ten thousand simulated games that made the forecast: the share of those games the home team went on to win from that situation, with these lineups, starters and bullpens. The in-game number in the header is exact, a fresh set of continuations from the current state at each check. Both start from the pregame headline: the gap between the headline and the simulator at first pitch is carried into the game and fades as the innings run out. Each is then averaged with how 2023 to 2025 games actually went from the same situation, anchored the same way: scored on every plate appearance of the 2025 and 2026 seasons, the average was more accurate than this game's simulations alone or the league's record alone.</p>";
    h += "<h2>Past games</h2><p>Use the date strip or the calendar to open any day of the 2025 and 2026 seasons. Every game shows the real box score and play-by-play from MLB, next to the model's numbers. Days before the live record began show a model replay: each game re-run after the season with only what was known before it (lineups and starters as they played, history through the day before), so you can see how the model and the market would have called it. The replays are labeled, and the Record page scores live forecasts separately.</p>";
    h += "<h2>Checking the work</h2><p>Every forecast is saved and published before first pitch and never edited. After the final, the Record page scores the last pregame version against a coin flip, always picking the home team, and the betting market's last pregame line. Nothing is backfilled.</p>";
    h += "<h2>Current limits</h2><ul><li>Postseason bullpens keep their regular-season roles; only the starter's expected length changes.</li><li>The pitch lines under each simulated plate appearance are bookkeeping, not a pitch-by-pitch simulation: real count paths from prior official games for the same outcome, with the pitcher's own pitch types and speeds. Where a ball went (ground ball to shortstop, fly ball to center field) is drawn the same way from the batter's own prior balls in play, or the league's for his hand. None of it changes an outcome or a pitching decision.</li><li>Runner speed and team defense are league average for everyone; stolen bases and wild pitches are not simulated.</li><li>Bullpen use follows regular-season habits: a fitted rest and quality model was tested on the 2026 replay and did not beat it.</li><li>Player history runs through " + esc(any.history_through || "the day before") + ".</li></ul>";
    var modelNames = []; Object.keys(fx).forEach(function (k) { var m = String(fx[k].model || ""); if (m && modelNames.indexOf(m) < 0) modelNames.push(m); });
    h += "<h2>Technical details</h2><p>Plate appearance model " + esc(modelNames.join(", ") || any.model || "") + ". " + Number(any.n_simulations || 0).toLocaleString() + " simulations per forecast. Earlier forecast versions are kept when lineups change. Source code is public; player data and model files stay private.</p>";
    var vs = Object.keys(fx).map(function (k) { return fx[k]; }).filter(function (f) { return f.date === D.date; });
    vs.forEach(function (f) {
      var all = versionsFor(f.game_pk);
      h += '<details class="ver-hist"><summary>' + esc(f.away.abbr + " at " + f.home.abbr) + ": " + all.length + (all.length === 1 ? " saved version" : " saved versions") + '</summary><ul>';
      all.forEach(function (x) { h += "<li>Version " + x.version + ", " + esc(timeET(x.saved_at)) + " ET: " + esc(x[favorite(x)].abbr) + " " + pct(winProb(x, favorite(x))) + "</li>"; });
      h += "</ul></details>";
    });
    app.innerHTML = h + "</div></div>";
  }

  /* ---------- boot ---------- */
  function boot(json) {
    D = json;
    window.addEventListener("hashchange", route);
    if (window.matchMedia) {
      var scheme = window.matchMedia("(prefers-color-scheme: dark)"), onScheme = function () { NIGHT = scheme.matches; route(); };
      if (scheme.addEventListener) scheme.addEventListener("change", onScheme); else if (scheme.addListener) scheme.addListener(onScheme);
    }
    route();
    setInterval(lcTick, 15000);
    setTimeout(lcTick, 1200);
    window.addEventListener("hashchange", function () { setTimeout(lcTick, 300); });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") lcTick(); });
    fetch("days/index.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (idx) {
      if (idx && idx.dates) { ARCHIVE = idx; if (!location.hash || /^#\/?$/.test(location.hash) || /^#\/day\//.test(location.hash)) route(); }
    }).catch(function () {});
  }
  if (window.BRL) boot(window.BRL);
  else fetch(DATA_URL, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(boot).catch(function () {
    app.innerHTML = '<div class="wrap"><p class="empty">Forecasts could not load. Refresh the page to try again.</p></div>';
  });
})();
</script>
