name: BRL Kalshi history
on:
  workflow_dispatch:
    inputs:
      series:
        description: 'Series to fetch, space-separated (blank: every series in tools/kalshi_series.txt)'
        required: false
        default: ''
  push:
    branches: [diag/kalshi]
permissions:
  contents: read
concurrency:
  group: brl-kalshi-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      series: ${{ steps.plan.outputs.series }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
        with:
          persist-credentials: false
      - id: plan
        name: Series from the dispatch input, else tools/kalshi_series.txt (one job per series)
        env:
          ONLY: ${{ github.event.inputs.series }}
        # the input reaches Python only as an environment variable, and each name must look like a series ticker
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re
          s = (os.environ.get('ONLY') or open('tools/kalshi_series.txt').read()).replace(',', ' ').split()
          assert all(re.fullmatch(r'[A-Z0-9]+(@\d{4}-\d\d-\d\d:\d{4}-\d\d-\d\d)?', x) for x in s), 'series names: capitals and digits only'
          print('series=' + json.dumps(s))
          PY
  kalshi:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2          # Kalshi's public API: two series at a time, each paced well under its limit
      matrix:
        series: ${{ fromJson(needs.plan.outputs.series) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=2,<3" "pandas>=2,<4" cryptography==46.0.4
      - name: Kalshi's settled MLB markets with pregame prices (public market data; no account, no key)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_KALSHI_SERIES: ${{ matrix.series }}
          BRL_KALSHI_PROP_LINES: 'KXMLBHIT:1,2 KXMLBTB:2 KXMLBHR:1 KXMLBHRR:1,2 KXMLBRBI:1,2'   # strikeouts: every line
          BRL_KALSHI_RATE: '6'
          BRL_KALSHI_MINUTES: '330'
        run: python tools/brl_kalshi_history.py
