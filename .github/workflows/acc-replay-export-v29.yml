name: ACC replay sealed-input export v29
on:
  push:
    branches: [diag/acc-replay-export-v29]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Restore pinned data and re-encrypt for the private research checkpoint
        env:
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, io, json, os, shutil, zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from brl_live.bootstrap import fetch, restore, TAG, ASSET

          public_pem = b"""-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwE3loWH/ivoPzHIPEWz+
          2yP1PB7d1+zdtx9jftvU4pzD2UEoWb8niz8yul3wq/IF9j3CENV/QFN/pF+dule/
          h6hAMMr/lU91svHuhzO//VZ/zKMJ7fDKscQJPcY03aFzrqofLys5XaQZrygjgEpu
          cC4FdtjWtaiXdnqXvphZvYy8jfrdWZ7hAry+kFE9icpgO8Mxy1j9pEhE09pToM30
          2ZQfYQ55FmLImIq5M78/VcBOSmyQHY2myJDS6aGN3+DnoYI8Drd0kLzXdrr/o9AC
          3IAToyJEP63tQL6VjOvWfV+CtjAzV/DufN7/AZapKIlI3golU7OxYt3YmxjkzdnD
          l5s3qW08M+3nNIduGaGnRz3czrgHFPNXu6CQQwXg3JAngKepc7n5mo5p7tAjrG0W
          2dSqsCPDOKKxoWbVDe9iWjsx6GYLiBeme1Dmp9MDdNU5YZqO1XxEVj4pxhEWF9vF
          3trkz+Cz062SkWEAjJidPenIBzs1RtNUv5do2wGqQHl1AgMBAAE=
          -----END PUBLIC KEY-----
          """
          public_pem = b"\n".join(line.strip() for line in public_pem.splitlines()) + b"\n"
          key_hex = os.environ.get("BRL_PA_PACKAGE_KEY", "")
          if not key_hex:
              raise SystemExit("repository secret missing")
          config = json.loads(Path("brl_live/runtime.json").read_text())
          root = Path(os.environ["RUNNER_TEMP"]) / "acc-v29-export"
          container = restore(
              fetch(f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{TAG}/{ASSET}"),
              key_hex, config, root / "container"
          )
          allowed_dirs = {"pa_model_reference", "model_runs", "data"}
          allowed_files = {"requirements-cloud.txt", "RUNTIME_MANIFEST.json"}
          listing = []
          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in sorted(container.rglob("*")):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(container).as_posix()
                  if rel.split("/", 1)[0] not in allowed_dirs and rel not in allowed_files:
                      continue
                  raw = path.read_bytes()
                  info = zipfile.ZipInfo(rel, date_time=(1980,1,1,0,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o600 << 16
                  z.writestr(info, raw)
                  listing.append({"path": rel, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()})
          plain = buffer.getvalue()
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          aad = b"BRL:v29-data-export"
          cipher = AESGCM(aes_key).encrypt(nonce, plain, aad)
          pub = serialization.load_pem_public_key(public_pem)
          wrapped = pub.encrypt(aes_key, padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()), algorithm=hashes.SHA256(), label=b"BRL:v29-key"))
          out = root / "artifact"; out.mkdir(parents=True, exist_ok=True)
          payload = b"BRLV29E1" + nonce + cipher
          (out / "brl-v29-data.zip.enc").write_bytes(payload)
          (out / "brl-v29-data.key.wrap").write_bytes(wrapped)
          manifest = {
              "schema":"brl.acc-replay-export.v29",
              "created_at":datetime.now(timezone.utc).isoformat(),
              "source_runtime_tag":TAG,
              "source_cipher_sha256":config["cipher_sha256"],
              "source_plaintext_sha256":config["plaintext_sha256"],
              "recipient_public_key_sha256":"95c8a60652b25e33b9342f88a796152af2f4e11ae5aa756b968008a1c408c2c9",
              "aad":"BRL:v29-data-export",
              "payload_sha256":hashlib.sha256(payload).hexdigest(),
              "wrapped_key_sha256":hashlib.sha256(wrapped).hexdigest(),
              "plaintext_zip_sha256":hashlib.sha256(plain).hexdigest(),
              "plaintext_zip_bytes":len(plain),
              "files":listing,
          }
          (out / "MANIFEST.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps({"status":"sealed","files":len(listing),"bytes":len(plain),"payload_sha256":manifest["payload_sha256"]}))
          shutil.rmtree(container)
          PY
      - name: Upload encrypted export only
        uses: actions/upload-artifact@v4
        with:
          name: acc-replay-v29-sealed-inputs
          path: ${{ runner.temp }}/acc-v29-export/artifact
          retention-days: 1
          if-no-files-found: error
      - name: Remove restored data
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/acc-v29-export"
