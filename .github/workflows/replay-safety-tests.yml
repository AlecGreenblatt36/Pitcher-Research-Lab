name: Replay safety tests

on:
  push:
    branches:
      - feature/game-simulator-v2-locked-model
    paths:
      - "research_lab/game_sim/sequential_history_compat.py"
      - "scripts/run_2025_variant_shard_v2.py"
      - "tests/test_sequential_history_recovery.py"
      - "requirements-replay-lock.txt"
      - ".github/workflows/replay-safety-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-replay-lock.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-replay-lock.txt
      - name: Run recovery independence tests
        run: pytest -q tests/test_sequential_history_recovery.py
      - name: Compile replay scripts
        run: >-
          python -m py_compile
          research_lab/game_sim/sequential_history_compat.py
          scripts/run_2025_variant_shard_v2.py
          scripts/recover_2025_variant_v2.py
