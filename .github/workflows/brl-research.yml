name: BRL research
on:
  workflow_dispatch:
  push:
    branches: [diag/research]
permissions:
  contents: write
concurrency:
  group: brl-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=2,<3" "pandas>=2,<4" "scikit-learn>=1.5,<2" "scipy>=1.12,<2" joblib requests cryptography==46.0.4
      - name: Run the experiment on the sealed data (only metrics leave the runner)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
        run: |
          if [ -f tools/research_experiment.txt ]; then export BRL_EXPERIMENT="$(tr -d '[:space:]' < tools/research_experiment.txt)"; fi
          python tools/brl_research.py
      - name: Remove decrypted files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/brl-research"
