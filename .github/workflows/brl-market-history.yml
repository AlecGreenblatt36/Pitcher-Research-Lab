name: BRL market history
on:
  workflow_dispatch:
  push:
    branches: [diag/market]
permissions:
  contents: write
jobs:
  market:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read a past season's pregame lines (public odds only, no secrets)
        if: hashFiles('tools/skip_espn_history') == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_MARKET_SEASON: '2026'
        run: python tools/brl_market_history.py
      - name: Read 2021-2025 lines from a public dataset and match them to official games
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/brl_market_sbr.py
