name: BRL encrypted current inputs
on:
  push:
    branches: [feature/private-history-refresh-20261006]
    paths: [.github/workflows/brl-current-pregame-probe.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet cryptography==46.0.4
      - name: Read only current game inputs and encrypt before writing
        run: |
          python - <<'PY'
          import base64,datetime,gzip,hashlib,json,os,pathlib,urllib.request
          from zoneinfo import ZoneInfo
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey,X25519PublicKey
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          out=pathlib.Path('encrypted_probe');out.mkdir()
          now=lambda:datetime.datetime.now(datetime.timezone.utc).isoformat()
          sources=[]
          def get(name,url):
              start=now()
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'BRL-live-input-check/1.0'}),timeout=25) as r:
                  raw=r.read(20000001)
                  if r.status!=200 or len(raw)>20000000:raise ValueError('Invalid status or oversized input')
              sources.append({'name':name,'url':url,'requested_at':start,'finished_at':now(),'sha256':hashlib.sha256(raw).hexdigest(),'body_base64':base64.b64encode(raw).decode()})
              return json.loads(raw)
          day=datetime.datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          schedule=get('current_schedule','https://statsapi.mlb.com/api/v1/schedule?sportId=1&date='+day)
          statuses=[]
          for d in schedule.get('dates',[]):
              for g in d['games']:
                  if g['gameType'] not in ('R','F','D','L','W'):continue
                  pk=g['gamePk'];feed=get('current_'+str(pk),f'https://statsapi.mlb.com/api/v1.1/game/{pk}/feed/live')
                  statuses.append({'game_pk':pk,'state':feed['gameData']['status']['abstractGameState'],'scheduled_start':feed['gameData']['datetime']['dateTime']})
          recipient=bytes.fromhex('d35a6ef9dc32acc1abe16e5b468e1f78fe0370710878c8926c6a21c3fdedc255')
          ephemeral=X25519PrivateKey.generate();salt=os.urandom(16);nonce=os.urandom(12)
          key=HKDF(algorithm=hashes.SHA256(),length=32,salt=salt,info=b'BRL-private-history-source-v1').derive(ephemeral.exchange(X25519PublicKey.from_public_bytes(recipient)))
          header=b'BRLX2551'+ephemeral.public_key().public_bytes_raw()+salt+nonce
          raw=gzip.compress(json.dumps({'sources':sources},separators=(',',':')).encode(),mtime=0)
          cipher=header+AESGCM(key).encrypt(nonce,raw,header+recipient)
          (out/'source_bundle.enc').write_bytes(cipher)
          receipt={'captured_at':now(),'games':statuses,'cipher_sha256':hashlib.sha256(cipher).hexdigest(),'raw_data_published':False,'forecasts_created':0}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: brl-encrypted-current-inputs
          path: encrypted_probe/
          retention-days: 2
          if-no-files-found: error
