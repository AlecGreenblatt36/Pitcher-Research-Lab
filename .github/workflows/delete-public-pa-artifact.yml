name: Delete exposed PA reproducibility artifact

on:
  workflow_dispatch:
  push:
    branches:
      - feature/game-simulator-v2-locked-model
    paths:
      - ".github/workflows/delete-public-pa-artifact.yml"

permissions:
  actions: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifact 11287257159
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11287257159"
