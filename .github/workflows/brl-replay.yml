name: BRL replay
on:
  workflow_dispatch:
  push:
    branches: [diag/replay]
permissions:
  contents: write
concurrency:
  group: brl-replay-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
      - id: plan
        name: Shards from tools/replay_params.json (one job per shard, run in parallel)
        run: python -c "import json; k=int(json.load(open('tools/replay_params.json')).get('shards') or 1); print('shards=' + json.dumps(list(range(k))))" >> "$GITHUB_OUTPUT"
  replay:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=2,<3" "pandas>=2,<4" "scikit-learn>=1.5,<2" "scipy>=1.12,<2" joblib requests cryptography==46.0.4
      - name: Replay the season (only per-game model outputs and scores leave the runner)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
          BRL_REPLAY_SHARD: ${{ matrix.shard }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python tools/brl_replay.py
      - name: Remove decrypted files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/brl-replay"
