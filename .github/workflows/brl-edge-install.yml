name: BRL edge metrics patch verification
on:
  push:
    branches: [feature/edge-track-metrics-20261006]
    paths: [.github/workflows/brl-edge-install.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct pinned public source and verify every file
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          raw=base64.b64decode(''.join((root/f'.edge_patch/{i}.b64').read_text().strip() for i in range(3)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='2da18fcf217c96baa72044421c9f20a9478d8c641cea2bc96465179e23ce2da6','Source transfer checksum mismatch'
          files=json.loads(lzma.decompress(raw))
          expected={'brl_live/edge_metrics.py','brl_live_tests/test_edge_metrics.py','research/edge_track/README.md','research/edge_track/experiments.json','research/edge_track/report.py','research/edge_track/doc_updates/METHODS.md','research/edge_track/doc_updates/LEDGER.md','research/edge_track/doc_updates/HANDOFF.md','changes.patch','final_manifest.json'}
          assert set(files)==expected,'Unexpected public patch entry'
          for name,text in files.items():
              if name in ('changes.patch','final_manifest.json'):continue
              p=root/name
              assert not p.exists(),'New source unexpectedly exists'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'edge-source.patch'
          patch.write_text(files['changes.patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          manifest=json.loads(files['final_manifest.json'])
          for name,digest in manifest.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,'Final source digest mismatch: '+name
          pathlib.Path('edge_patch_manifest.json').write_text(json.dumps(manifest,indent=2))
          print('Verified',len(manifest),'public source files; no raw data or models in patch')
          PY
      - name: Restore the existing encrypted test runtime
        env:
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
        run: |
          python -m pip install --disable-pip-version-check --quiet cryptography==46.0.4
          python - <<'PY'
          import json,os
          from pathlib import Path
          from brl_live.bootstrap import fetch,restore,TAG,ASSET
          config=json.loads(Path('brl_live/runtime.json').read_text())
          restore(fetch('https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/'+TAG+'/'+ASSET),os.environ['BRL_PA_PACKAGE_KEY'],config,Path(os.environ['RUNNER_TEMP'])/'brl-private')
          print('Existing encrypted runtime authenticated; key and private contents not logged')
          PY
      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r "$RUNNER_TEMP/brl-private/requirements-cloud.txt" pytest==9.0.2
      - name: Run isolated accounting, baseline and scoring regressions
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP"
          export PYTHONPATH="$RUNNER_TEMP/brl-private:$GITHUB_WORKSPACE"
          python -m pytest -c /dev/null --import-mode=importlib "$GITHUB_WORKSPACE/brl_live_tests/test_edge_metrics.py" "$GITHUB_WORKSPACE/brl_live_tests/test_boxscore.py" "$GITHUB_WORKSPACE/brl_live_tests/test_public_check.py" -q | tee "$GITHUB_WORKSPACE/edge_patch_tests.txt"
          python -m compileall -q "$GITHUB_WORKSPACE/brl_live" "$GITHUB_WORKSPACE/research/edge_track" "$GITHUB_WORKSPACE/tools/check_brl_phone_page.py"
          python - <<'PY'
          import pathlib,os
          from brl_live.box_page import JS
          pathlib.Path(os.environ['RUNNER_TEMP'],'edge-page.js').write_text(JS)
          PY
          node --check "$RUNNER_TEMP/edge-page.js"
      - name: Preserve methods, ledger and handoff with this scope
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('METHODS','LEDGER','HANDOFF'):
              p=Path(name+'.md');addition=Path('research/edge_track/doc_updates',name+'.md').read_text()
              current=p.read_text()
              if addition.strip() not in current:p.write_text(current.rstrip()+'\n\n'+addition)
          PY
      - name: Commit tested public source and remove temporary transport files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brl_live/edge_metrics.py brl_live/boxscore.py brl_live/box_runner.py brl_live/box_page.py brl_live_tests/test_edge_metrics.py tools/check_brl_phone_page.py research/edge_track METHODS.md LEDGER.md HANDOFF.md
          git rm -r .edge_patch
          git rm .github/workflows/brl-edge-install.yml
          git commit -m 'Add tested seven-target fair comparisons and five registered edge candidates; no model adoption'
          git push origin HEAD:feature/edge-track-metrics-20261006
      - name: Save public verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brl-edge-patch-tests
          path: |
            edge_patch_tests.txt
            edge_patch_manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove decrypted test runtime
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/brl-private"
