name: BRL probe
on:
  workflow_dispatch:
  push:
    branches: [diag/probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe whether the page can read the official feeds directly (no secrets used)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PROBE_FIELDS: gamePk,gameData,status,abstractGameState,detailedState,liveData,linescore,currentInning,inningState,isTopInning,outs,balls,strikes,teams,away,home,runs,hits,errors,innings,num,offense,defense,first,second,third,batter,pitcher,id,fullName,battingOrder,boxscore,players,person,stats,batting,pitching,plays,allPlays,about,atBatIndex,halfInning,inning,isComplete,result,eventType,description,awayScore,homeScore,rbi,matchup,count,playEvents,isPitch,details,code,type,pitchData,startSpeed,coordinates,pX,pZ,strikeZoneTop,strikeZoneBottom,hitData,launchSpeed,totalDistance,trajectory,location,coordX,coordY,runners,movement,start,end,isOut,playIndex,credits,position
        run: python tools/brl_probe_cors.py
      - name: Probe whether past scoreboards keep the pregame moneylines
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/brl_probe_market.py
