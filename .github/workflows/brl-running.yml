name: BRL base running data
on:
  workflow_dispatch:
  push:
    branches: [diag/running]
permissions:
  contents: write
jobs:
  running:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sprint speed and stolen bases by player and season (public statistics only, no secrets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/brl_running_data.py
