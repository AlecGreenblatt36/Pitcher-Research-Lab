name: BRL live v2 (shadow)
on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [brl_engine/**, .github/workflows/brl-live-v2.yml]
permissions:
  contents: write
concurrency:
  group: brl-live-v2-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the authenticated-encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Own-runtime iteration on the shadow ledger branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
          BRL_LEDGER_BRANCH: brl-live-data-v2
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python brl_engine/entrypoint.py --shadow --site "$RUNNER_TEMP/brl-site-v2" --runtime "$RUNNER_TEMP/brl-private-v2"
      - name: Save the shadow page and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brl-v2-shadow
          path: |
            ${{ runner.temp }}/brl-site-v2
            brl_v2_run_receipt.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove decrypted working files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/brl-private-v2"
