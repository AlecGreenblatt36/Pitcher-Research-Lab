name: BRL pitch table
on:
  workflow_dispatch:
  push:
    branches: [diag/pitch-table]
permissions:
  contents: write
concurrency:
  group: brl-pitch-table-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      seasons: ${{ steps.plan.outputs.seasons }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
      - id: plan
        name: Seasons from tools/pitch_table_seasons.txt (one job per season)
        run: python -c "import json; s=[int(x) for x in open('tools/pitch_table_seasons.txt').read().replace(',', ' ').split()]; print('seasons=' + json.dumps(s))" >> "$GITHUB_OUTPUT"
  table:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        season: ${{ fromJson(needs.plan.outputs.seasons) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=2,<3" "pandas>=2,<4" "scikit-learn>=1.5,<2" "scipy>=1.12,<2" joblib requests cryptography==46.0.4
      - name: Flatten and seal the season's pitch table (plaintext never leaves the runner)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
          BRL_SEASON: ${{ matrix.season }}
        run: python tools/brl_pitch_table.py
