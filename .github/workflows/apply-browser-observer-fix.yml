name: Apply browser observer fix

on:
  push:
    branches:
      - "feature/pa-model-v1"
    paths:
      - ".github/workflows/apply-browser-observer-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pa-model-v1
          fetch-depth: 0
      - name: Patch navigation observer loop
        run: |
          python scripts/apply_browser_observer_fix.py
          node --check static/performance.js
          node --check static/navigation.js
      - name: Commit source fix and remove one-time patch files
        run: |
          rm scripts/apply_browser_observer_fix.py
          rm .github/workflows/apply-browser-observer-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stop browser navigation MutationObserver loop"
          git push origin HEAD:feature/pa-model-v1
