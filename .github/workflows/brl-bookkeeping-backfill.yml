name: BRL bookkeeping backfill
on:
  workflow_dispatch:
  push:
    branches: [diag/bookkeeping-backfill]
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4 numpy pandas
      - name: Seal the season's pitch sequences and batted-ball records (plaintext never leaves the runner)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
        run: python tools/brl_bookkeeping_backfill.py
