name: Apply UI integration fix

on:
  push:
    branches:
      - "feature/pa-model-v1"
    paths:
      - ".github/workflows/apply-ui-integration-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pa-model-v1
          fetch-depth: 0
      - name: Patch global pitch controls
        run: |
          python scripts/apply_ui_integration_fix.py
          node --check static/performance.js
          node --check static/pitcher_context.js
      - name: Commit branch fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/performance.js static/pitcher_context.js
          git commit -m "Keep primary pitch controls visible after reload"
          git push origin HEAD:feature/pa-model-v1
