name: BRL box-score patch verification
on:
  push:
    branches: [feature/box-score-sprint-20261006]
    paths: [.github/workflows/brl-box-install.yml]
permissions:
  contents: write
concurrency:
  group: brl-box-score-install
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/box-score-sprint-20261006
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct checksum-pinned public source only
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib,ast
          root=pathlib.Path('.').resolve()
          raw=base64.b64decode(''.join((root/f'_box_sprint_public/source.part{i}').read_text().strip() for i in (1,2,3)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='e3a15c570925366c88b0fdc2ad6a04f0d963db54db8f7e1b34b627dc126dcb3a','Public source bundle checksum mismatch'
          files=json.loads(lzma.decompress(raw))
          allowed={'brl_live/boxscore.py','brl_live/box_runner.py','brl_live/box_page.py','brl_live_tests/test_boxscore.py','tools/check_brl_phone_page.py'}
          assert set(files)==allowed
          for name,text in files.items():
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
          p=root/'brl_live/entrypoint.py';text=p.read_text()
          old='from brl_live.live_extension import main as run_iteration'
          assert text.count(old)==1,'Unexpected launcher version'
          text=text.replace(old,'from brl_live.box_runner import main as run_iteration')
          text=text.replace("'refresh_extension':'prior-day-v1'","'refresh_extension':'box-score-v1'")
          oldline="page.write_text(page.read_text().replace('<main>','<main><div class=\"notice\">Refresh blocked; showing the last saved forecasts. '+html.escape(reason)+'</div>',1))"
          assert text.count(oldline)==1,'Unexpected fallback renderer'
          text=text.replace(oldline,"page.write_text(page.read_text().replace('<body>', '<body data-refresh-blocked=\"true\">', 1))")
          p.write_text(text)
          p=root/'brl_live/box_page.py';text=p.read_text()
          old="const groups=[[1,2,3,4,5],[6,7,8,9,'Extra']];"
          new="const last=Math.max(9,...Object.keys(innings.away||{}).map(Number),...Object.keys(innings.home||{}).map(Number)); const groups=[];for(let start=1;start<=last;start+=5)groups.push(Array.from({length:Math.min(5,last-start+1)},(_,j)=>start+j));"
          assert text.count(old)==1;text=text.replace(old,new).replace('Extra contains all extra-inning runs.','Extra innings are shown individually.');p.write_text(text)
          for item in ast.parse(text).body:
              if isinstance(item,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='JS' for t in item.targets):pathlib.Path('box_page_check.js').write_text(ast.literal_eval(item.value))
          print(json.dumps({'public_patch_files':sorted(allowed),'raw_data_in_patch':False,'runtime_or_key_modified':False}))
          PY
          node --check box_page_check.js
      - name: Restore existing encrypted runtime for tests
        env:
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
        run: |
          python -m pip install --disable-pip-version-check --quiet cryptography==46.0.4
          python - <<'PY'
          import json,os,pathlib
          from brl_live.bootstrap import fetch,restore,TAG,ASSET
          repo=os.environ['GITHUB_REPOSITORY'];config=json.loads(pathlib.Path('brl_live/runtime.json').read_text())
          restore(fetch(f'https://github.com/{repo}/releases/download/{TAG}/{ASSET}'),os.environ['BRL_PA_PACKAGE_KEY'],config,pathlib.Path(os.environ['RUNNER_TEMP'])/'brl-test-runtime')
          print('Existing runtime authenticated; key value not printed.')
          PY
      - name: Install isolated runtime test dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r "$RUNNER_TEMP/brl-test-runtime/requirements-cloud.txt" pytest==9.0.2
      - name: Execute box-accounting and public-check regressions
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -o pipefail
          python -m compileall -q brl_live brl_live_tests tools/check_brl_phone_page.py
          cd "$RUNNER_TEMP/brl-test-runtime"
          PYTHONPATH="$RUNNER_TEMP/brl-test-runtime:$GITHUB_WORKSPACE" python -m pytest -c /dev/null --import-mode=importlib "$GITHUB_WORKSPACE/brl_live_tests/test_boxscore.py" "$GITHUB_WORKSPACE/brl_live_tests/test_public_check.py" -q | tee "$GITHUB_WORKSPACE/box_patch_tests.log"
      - name: Record methods, ledger and cold-start handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          entries={
          'METHODS.md': '''\n\n## Box-score sprint (October 6, 2026)\n\nThe box layer observes the locked simulator without consuming its random stream or changing any PA probability, runner transition, or pitcher-removal choice. It records the selected scoring runners and reconciles team runs/hits, batting PA/AB and opposing pitcher lines in every world. All projected means and count distributions include all 10,000 worlds, including zero opportunity for nonappearing pitchers. Five complete examples are retained: one with the most frequent exact score pair and four fixed world positions. This is a typical score, not a uniquely most probable sequence. Every extra inning is shown separately in the line score.\n\nThe inherited PA corpus normalizes pitch_number to 1 and cannot estimate pitch counts. Actual earlier official playEvents supply joint BB/HBP and pitch-count annotations on an independent stream conditional on pitcher, outcome and batter hand, with pitcher/outcome and league fallbacks. These are estimates from potentially small recent pools, not generated pitch sequences; they never feed the manager. The conditional pitch bridge is a separate next sprint.\n\nFinal actual boxes are parsed from the MLB Stats API only in the outcome path. Player IDs join actual and projected lines; totals reconcile with official inning scores and opposing pitching totals. An absent projected participant in a complete final listing has zero realized opportunity; a missing stat field is unavailable, not zero. Unprojected substitutes remain visible and unscored. Baseball innings x.2 convert to 3*x+2 outs.\n\nPlayer hit/HR/K and pitcher K/innings distributions use fair finite-ensemble CRPS: mean absolute distance to the observation minus distinct-draw pair distance. Innings scores are outs scores divided by three. Hit/HR occurrence also use corrected Brier. The latest eligible public box version per game is selected without looking at outcomes. Its own content hash, commit and publication time must precede observed first pitch; a previous win-only forecast cannot backdate player distributions. Player rows within a game are dependent and are not independent confirmation samples.\n\nThe phone UI uses the prototype fonts/colors and Eastern times, with amber only for actuals. Complete player lines wrap into readable grids rather than shrinking wide tables. Definitions and limitations are in How to read this. Only forecast output distributions, five selected simulated paths and final box summaries are public; raw inputs, model files and keys remain encrypted/private.\n''',
          'LEDGER.md': '''\n\n## Box-score sprint\n\n| ID | Attempt | Result | Delta Brier, 2025 | Delta log loss, 2025 |\n|---|---|---|---|---|\n| BOX-01 | Observe full player/inning books without changing the engine | 10,000 frozen-input score/seed vectors reproduced exactly; accounting tests passed | Not run | Not run |\n| BOX-02 | Use inherited PA pitch_number for counts | Rejected: column uniformly normalized to 1; no invented counts | Not run | Not run |\n| BOX-03 | Earlier official-pitch-event empirical annotations | Implemented on a separate stream; no removal/outcome effect | Not run | Not run |\n| BOX-04 | Actual ID joins and proper player scores | 17 genuine final feeds parsed; full 10,000-world historical comparison generated | Not run | Not run |\n| BOX-05 | Phone-first full boxes, five sample games and track record | Local 390px components passed; hosted check still required | Not run | Not run |\n\nFirst isolated cloud test failed because the dashboard pytest configuration imported public app.py instead of the private runtime app package. Corrected by an isolated pytest configuration/import mode; no model or test assertion was weakened. No accuracy upgrade adopted. Conditional pitch sequences and full 2025 evaluation are not part of this completed implementation evidence.\n''',
          'HANDOFF.md': '''\n\n## Latest priority: box scores before postseason policy\n\nNew modules: brl_live/boxscore.py (observation-only accounting, distributions, actual parser and proper scores), box_runner.py (same live engine plus box publication), box_page.py (prototype-styled phone product). entrypoint now calls box_runner. Encrypted runtime/key/pins and PA/starter/game logic are unchanged.\n\nNew ledger members: box_scores keyed by forecast ID; box_publications containing immutable box SHA256, commit and publication time; actual_boxes by game PK; player_scores with eligible version rows and latest-version aggregates. Immutable outputs: box_forecasts/<hash>.json. Public JSON adds these plus view_scope; the Pages file allowlist remains index.html, predictions.json and .nojekyll. No raw source, decrypted runtime or font file is published.\n\nAn old win-only snapshot receives one new box-bearing version. An unchanged already-box-bearing snapshot is skipped. All 10,000 worlds must finish; five exact sample seeds are replayed for complete books. Publication of player distributions has its own deadline and cannot borrow an old win forecast's timestamp. Actual boxes are reconciled by player ID. Late or altered distributions do not score.\n\nLocal evidence: 42 box tests passed; 17 genuine final feeds parsed; a 10,000-world frozen pregame case reproduced every original score/seed vector; a separate 10,000-world historical postseason game supplied real matching actual comparisons. Five changed views at 390px passed offline component checks. Hosted HTTPS checks must pass after merge before claiming deployment. The first cloud test encountered dashboard pytest.ini/app.py shadowing and was fixed with -c /dev/null --import-mode=importlib; don't install Flask just to conceal that wrong import.\n\nThe inherited pitch_number field was unusable (all 1). Actual prior-date official pitch events now provide independent empirical bookkeeping counts and BB/HBP split; no pitch sequences or manager effects. Pitch-by-pitch is the NEXT sprint. Then resume fitted postseason policy and the master plan. Historical UI previews use actual generation times, view_scope=historical_replay, no publication receipts and zero live scores. Never backdate these.\n\nAfter deployment: verify cloud box_forecasts_created, each distribution count and all five examples, actual first-pitch audit and final player scoring, the phone page screenshots and existing forecast-version preservation. Keep failures and missing metrics in the ledger. No 2025 model fitting/replay or accuracy upgrade occurred here.\n'''}
          for name,text in entries.items():
              p=Path(name);p.write_text(p.read_text()+text)
          PY
      - name: Commit verified transparent source and remove transport fragments
        run: |
          rm -rf _box_sprint_public
          rm .github/workflows/brl-box-install.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brl_live/boxscore.py brl_live/box_runner.py brl_live/box_page.py brl_live/entrypoint.py brl_live_tests/test_boxscore.py tools/check_brl_phone_page.py METHODS.md LEDGER.md HANDOFF.md
          git add -u _box_sprint_public .github/workflows/brl-box-install.yml
          git commit -m 'Add tested complete box-score observations, proper player scores and phone-first game pages'
          git push origin HEAD:feature/box-score-sprint-20261006
      - name: Save public test receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brl-box-patch-tests
          path: box_patch_tests.log
          retention-days: 7
          if-no-files-found: warn
      - name: Remove decrypted test runtime
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/brl-test-runtime"
