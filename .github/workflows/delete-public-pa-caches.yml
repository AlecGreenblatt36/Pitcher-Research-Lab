name: Delete public Statcast PA caches

on:
  workflow_dispatch:
  push:
    branches:
      - feature/game-simulator-v2-locked-model
    paths:
      - ".github/workflows/delete-public-pa-caches.yml"

permissions:
  actions: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact raw Statcast cache keys
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches?key=statcast-pa-v1-2023-03-20-2025-11-05" || true
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches?key=statcast-pa-locked-2026-v1-2023-03-20-2026-10-03" || true
