name: BRL game conditions
on:
  workflow_dispatch:
  push:
    branches: [diag/conditions]
permissions:
  contents: write
jobs:
  conditions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read weather, roof and home plate umpire for past regular seasons (public schedule, no secrets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/brl_game_conditions.py
