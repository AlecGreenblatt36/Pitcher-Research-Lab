name: BRL game conditions
on:
  workflow_dispatch:
  push:
    branches: [diag/conditions]
permissions:
  contents: write
jobs:
  conditions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read weather, roof and home plate umpire for past regular seasons (public schedule, no secrets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/brl_game_conditions.py
