name: BRL fit model
on:
  workflow_dispatch:
  push:
    branches: [diag/fit-model]
permissions:
  contents: write
concurrency:
  group: brl-fit-model
  cancel-in-progress: false
jobs:
  fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=2,<3" "pandas>=2,<4" "scikit-learn>=1.5,<2" "scipy>=1.12,<2" joblib requests cryptography==46.0.4
      - name: Fit and seal the model (only hashes and metrics leave the runner)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
        run: python tools/brl_fit_model.py
      - name: Remove decrypted files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/brl-fit"
