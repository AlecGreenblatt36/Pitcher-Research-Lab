name: Locked PA pinned-environment reproduction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-replay-lock.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-replay-lock.txt
      - name: Restore private PA package
        env:
          BRL_RCLONE_CONFIG_B64: ${{ secrets.BRL_RCLONE_CONFIG_B64 }}
          BRL_PRIVATE_PA_REMOTE: ${{ secrets.BRL_PRIVATE_PA_REMOTE }}
        run: bash scripts/restore_private_pa_package.sh
      - name: Reproduce locked predictions under pinned replay environment
        run: >-
          python scripts/verify_locked_pa_pinned_environment.py
          --output benchmark_results/locked_pa_pinned_reproduction/LOCKED_PA_PINNED_REPRODUCTION.json
      - name: Upload compact reproduction receipt
        uses: actions/upload-artifact@v4
        with:
          name: locked-pa-pinned-reproduction-receipt
          path: benchmark_results/locked_pa_pinned_reproduction/LOCKED_PA_PINNED_REPRODUCTION.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish compact receipt to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark_results/locked_pa_pinned_reproduction/LOCKED_PA_PINNED_REPRODUCTION.json
          if ! git diff --cached --quiet; then
            git commit -m "Record pinned-environment locked PA reproduction [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
