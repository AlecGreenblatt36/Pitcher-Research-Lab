name: Locked PA pinned-environment reproduction

on:
  push:
    branches:
      - feature/game-simulator-v2-locked-model
    paths:
      - "scripts/verify_locked_pa_pinned_environment.py"
      - "research_lab/game_sim/locked_pa_provider.py"
      - "research_lab/pa_model/**"
      - "requirements-replay-lock.txt"
      - ".github/workflows/locked-pa-pinned-reproduction.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-replay-lock.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-replay-lock.txt
      - name: Download locked PA reproducibility package
        uses: actions/download-artifact@v4
        with:
          name: pa-model-locked-2026-reproducibility-package
          path: pa_model_reference
          github-token: ${{ github.token }}
          repository: AlecGreenblatt36/Pitcher-Research-Lab
          run-id: 37159593828
      - name: Reproduce locked predictions under pinned replay environment
        run: >-
          python scripts/verify_locked_pa_pinned_environment.py
          --output benchmark_results/locked_pa_pinned_reproduction/LOCKED_PA_PINNED_REPRODUCTION.json
      - name: Upload reproduction receipt
        uses: actions/upload-artifact@v4
        with:
          name: locked-pa-pinned-reproduction-receipt
          path: benchmark_results/locked_pa_pinned_reproduction/LOCKED_PA_PINNED_REPRODUCTION.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish compact receipt to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark_results/locked_pa_pinned_reproduction/LOCKED_PA_PINNED_REPRODUCTION.json
          if ! git diff --cached --quiet; then
            git commit -m "Record pinned-environment locked PA reproduction [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
