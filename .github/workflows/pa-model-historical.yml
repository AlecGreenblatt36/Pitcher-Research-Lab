name: PA model historical benchmark — compact receipts only

on:
  workflow_dispatch:
    inputs:
      start:
        description: First Statcast date
        default: "2023-03-20"
        required: true
      end:
        description: Last Statcast date
        default: "2025-11-05"
        required: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-model.txt
      - name: Run frozen benchmark without a public raw-data cache
        run: >-
          python -m research_lab.pa_model.cli --verbose run-all
          --start "${{ inputs.start }}"
          --end "${{ inputs.end }}"
          --work-dir model_runs/pa_v1
      - name: Publish compact benchmark receipts only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark_results
          cp model_runs/pa_v1/artifacts/PA_BENCHMARK_RESULT.json benchmark_results/pa_model_latest.json
          cp model_runs/pa_v1/plate_appearances.csv.gz.receipt.json benchmark_results/pa_dataset_latest_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('benchmark_results/pa_model_latest.json')
          result = json.loads(path.read_text(encoding='utf-8'))
          full = result['models']['talent_plus_context']['metrics']
          talent = result['models']['talent_only']['metrics']
          candidate_entry = result['models'].get('blended_candidate', result['models']['talent_plus_context'])
          candidate = candidate_entry['metrics']
          candidate_tuning = candidate_entry.get('tuning', {})
          league = result['baselines']['league']
          eb = result['baselines']['empirical_bayes_matchup']
          value = result['incremental_value']
          ci_eb = value['full_vs_empirical_bayes_clustered_ci']
          ci_context = value['context_vs_talent_only_clustered_ci']
          promotion = result['promotion']
          development_pass = promotion.get('development_gate_passed', promotion.get('promoted', False))
          lines = [
              '# Latest chronological PA benchmark', '',
              f"Generated: `{result['generated_at_utc']}`",
              f"Claim status: `{result.get('claim_status', 'unknown')}`",
              f"Data: {result['data']['rows_test']:,} test PAs across {result['data']['games_test']:,} games.", '',
              '| Model | Log loss | Multiclass Brier | Classwise ECE |',
              '|---|---:|---:|---:|',
              f"| League | {league['log_loss']:.6f} | {league['multiclass_brier']:.6f} | {league['classwise_ece']:.6f} |",
              f"| Empirical Bayes matchup | {eb['log_loss']:.6f} | {eb['multiclass_brier']:.6f} | {eb['classwise_ece']:.6f} |",
              f"| Talent only | {talent['log_loss']:.6f} | {talent['multiclass_brier']:.6f} | {talent['classwise_ece']:.6f} |",
              f"| Talent + context | {full['log_loss']:.6f} | {full['multiclass_brier']:.6f} | {full['classwise_ece']:.6f} |",
              f"| Calibrated candidate | {candidate['log_loss']:.6f} | {candidate['multiclass_brier']:.6f} | {candidate['classwise_ece']:.6f} |", '',
              f"Relative log-loss gain vs league: **{100 * value['relative_log_loss_gain_vs_league']:.3f}%**",
              f"Relative log-loss gain vs empirical Bayes: **{100 * value['relative_log_loss_gain_vs_empirical_bayes']:.3f}%**",
              f"Candidate minus empirical-Bayes log loss: **{ci_eb['difference_nats_per_pa']:.6f}** (game-clustered 95% CI {ci_eb['ci_95_low']:.6f} to {ci_eb['ci_95_high']:.6f}).",
              f"Context minus talent-only log loss: **{ci_context['difference_nats_per_pa']:.6f}** (game-clustered 95% CI {ci_context['ci_95_low']:.6f} to {ci_context['ci_95_high']:.6f}).",
              f"Development gate: **{'PASS' if development_pass else 'FAIL'}**",
              f"Production promoted: **{'YES' if promotion.get('production_promoted', promotion.get('promoted', False)) else 'NO'}**",
          ]
          if 'model_weight' in candidate_tuning:
              lines.extend(['', f"Candidate blend: {100 * candidate_tuning['model_weight']:.1f}% calibrated model / {100 * candidate_tuning['empirical_bayes_weight']:.1f}% empirical Bayes."])
          lines.extend(['', result.get('interpretation_boundary', '')])
          Path('benchmark_results/pa_model_latest_summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark_results/pa_model_latest.json \
                  benchmark_results/pa_dataset_latest_receipt.json \
                  benchmark_results/pa_model_latest_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "Record PA benchmark receipt for ${GITHUB_SHA::7} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Enforce private-data boundary
        run: |
          echo "No raw Statcast cache, PA table, row-level prediction file, or model binary is uploaded from this public workflow."
          echo "Any reproducibility package must be moved to approved private storage out of band."
