name: BRL public phone check
on:
  workflow_run:
    workflows: [BRL live slate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [diag/check]
permissions:
  contents: write
concurrency:
  group: brl-public-phone-check
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public browser-check dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.57.0 pytest==9.0.2 "numpy>=2,<3"
      - name: Test public-layer logic without private runtime
        run: python -m pytest brl_live_tests/test_public_check.py brl_live_tests/test_record.py brl_live_tests/test_world_selection.py brl_live_tests/test_box_identity.py brl_live_tests/test_market.py -q
      - name: Test the own runtime (public engine code, no data files needed)
        run: |
          python -m pip install --disable-pip-version-check "pandas>=2,<4" "scikit-learn>=1.5,<2" "scipy>=1.12,<2" joblib requests cryptography==46.0.4
          cd /tmp && PYTHONPATH="$GITHUB_WORKSPACE/brl_engine/runtime:$GITHUB_WORKSPACE" python -m pytest -c /dev/null --rootdir="$GITHUB_WORKSPACE" --import-mode=importlib "$GITHUB_WORKSPACE/brl_engine/tests" "$GITHUB_WORKSPACE/brl_live_tests" -q -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/pytest.txt"; test "${PIPESTATUS[0]}" -eq 0
      - name: Record the test output on the ledger branch when the tests fail (logs are not readable from outside)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/brl_record_diagnostic.py "diagnostics/tests_${GITHUB_RUN_ID}.txt" "$RUNNER_TEMP/pytest.txt"
      - name: Install ordinary Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Check the deployed page on desktop and phone
        run: python tools/check_brl_phone_page.py --output phone-check
      - name: Record the latest page-check receipt on the ledger branch (read from outside)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f phone-check/receipt.json || exit 0
          python -c "import json; r=json.load(open('phone-check/receipt.json')); json.dump({k: r.get(k) for k in ('started_at', 'finished_at', 'status', 'error', 'browser_feed', 'past_games', 'players', 'report', 'checks', 'scored_games')}, open('phone-check/summary.json', 'w'), indent=1)"
          python tools/brl_record_diagnostic.py "diagnostics/phone_check_latest.json" phone-check/summary.json || true
      - name: Record the page-check receipt on the ledger branch when the check fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/brl_record_diagnostic.py "diagnostics/phone_check_${GITHUB_RUN_ID}.json" phone-check/receipt.json
      - name: Save public-only verification receipt and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brl-public-phone-check
          path: phone-check/
          retention-days: 7
          if-no-files-found: error
