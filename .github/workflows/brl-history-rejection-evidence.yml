name: BRL rejected history diagnostic
on:
  push:
    branches: [feature/live-history-refresh-20261006]
    paths: [.github/workflows/brl-history-rejection-evidence.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 cryptography==46.0.4
      - name: Preserve failed inputs under public-key encryption
        run: |
          python - <<'PY'
          import os,re,json,gzip,base64,hashlib,pathlib,datetime,io
          import pandas as pd
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from brl_live.history_refresh import PublicSource,capture_day,RefreshBlocked,canonical,EVENTS,EXCLUDED
          text=pathlib.Path('.github/workflows/brl-history-strict-check.yml').read_text()
          pem=re.search(r'-----BEGIN PUBLIC KEY-----.*?-----END PUBLIC KEY-----',text,re.S).group()
          pem='\n'.join(line.strip() for line in pem.splitlines()).encode()
          public=serialization.load_pem_public_key(pem)
          class Recording(PublicSource):
              def __init__(self):super().__init__();self.evidence=[]
              def get(self,url):
                  raw,receipt=super().get(url);self.evidence.append({'raw_base64':base64.b64encode(raw).decode(),'receipt':receipt});return raw,receipt
          source=Recording();now=datetime.datetime.now(datetime.timezone.utc);report={'scope':'Rejected input diagnosis; not installed history','day':'2026-09-27','raw_data_published':False}
          try:capture_day(report['day'],source,now);report['status']='RECONCILED'
          except Exception as exc:report.update(status='BLOCKED',reason=str(exc) if isinstance(exc,RefreshBlocked) else type(exc).__name__)
          for item in source.evidence:
              if '/statcast_search/' in item['receipt']['url']:
                  frame=pd.read_csv(io.BytesIO(base64.b64decode(item['raw_base64'])),low_memory=False)
                  unknown=frame.loc[frame.events.notna()&~frame.events.isin(set(EVENTS)|EXCLUDED),'events'].value_counts()
                  report['unknown_event_counts']={str(k):int(v) for k,v in unknown.items()}
          plaintext=canonical({'captured_at':now.isoformat(),'sources':source.evidence});key=os.urandom(32);nonce=os.urandom(12)
          cipher=AESGCM(key).encrypt(nonce,gzip.compress(plaintext,mtime=0),b'BRL:audit-history')
          wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=b'BRL:audit-history'))
          bundle=canonical({'format':'RSA3072-OAEP-SHA256+AES256-GCM','wrapped_key':base64.b64encode(wrapped).decode(),'nonce':base64.b64encode(nonce).decode(),'ciphertext':base64.b64encode(cipher).decode()})
          out=pathlib.Path('rejection');out.mkdir();(out/'sources.enc').write_bytes(bundle);report['ciphertext_sha256']=hashlib.sha256(bundle).hexdigest();(out/'report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: brl-rejected-history-encrypted
          path: rejection/
          retention-days: 7
