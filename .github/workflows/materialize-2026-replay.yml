name: Materialize frozen 2026 replay sources

on:
  push:
    branches:
      - feature/dynamic-state-engine-v1
    paths:
      - ".replay_materialize/**"
      - ".github/workflows/materialize-2026-replay.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and validate source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .replay_materialize/payload_* > /tmp/2026_replay_payload.b64
          base64 --decode /tmp/2026_replay_payload.b64 > /tmp/2026_replay_payload.tar.gz
          echo "adb12ff0d087b25fa250a7db57c5a25646c62564c951cbff36737ab8bd84a6bd  /tmp/2026_replay_payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/2026_replay_payload.tar.gz -C .
          rm -rf .replay_materialize .github/workflows/materialize-2026-replay.yml
          python -m py_compile \
            research_lab/game_sim/replay_baselines.py \
            scripts/fit_starter_hazard_2026_lock.py \
            scripts/run_2026_variant_shard.py \
            scripts/merge_2026_variant_shards.py \
            scripts/finalize_2026_full_game_replay.py \
            scripts/render_2026_full_game_replay.py \
            tests/test_2026_replay_protocol.py
          git diff --check

      - name: Commit materialized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add frozen 2026 full-game replay protocol"
          git push origin HEAD:"${GITHUB_REF_NAME}"
