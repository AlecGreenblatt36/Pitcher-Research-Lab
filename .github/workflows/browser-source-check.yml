name: BRL browser official source check
on:
  push:
    branches: [feature/browser-source-check-20261006]
    paths: [.github/workflows/browser-source-check.yml]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check official MLB source and timecoded archive
        run: python tools/probe_official_source.py
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-probe
          path: source_probe/
          retention-days: 2
          if-no-files-found: error
