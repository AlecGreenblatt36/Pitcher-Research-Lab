name: PA model CI

on:
  pull_request:
    paths:
      - "research_lab/**"
      - "tests/test_pa_model.py"
      - "requirements-model.txt"
      - ".github/workflows/pa-model-ci.yml"
  push:
    branches:
      - "feature/pa-model-v1"
    paths:
      - "research_lab/**"
      - "tests/test_pa_model.py"
      - "requirements-model.txt"
      - ".github/workflows/pa-model-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-model.txt
      - run: pytest -q tests/test_pa_model.py
