name: Apply game simulator v2 core patch

on:
  push:
    branches:
      - feature/game-simulator-v2-locked-model
    paths:
      - ".bootstrap/game_v2_core_patch.zip"
      - ".github/workflows/apply-game-v2-core-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-simulator-v2-locked-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply source patch
        run: |
          set -euo pipefail
          rm -rf /tmp/brl-game-v2-patch
          mkdir -p /tmp/brl-game-v2-patch
          unzip -q .bootstrap/game_v2_core_patch.zip -d /tmp/brl-game-v2-patch
          rsync -a /tmp/brl-game-v2-patch/ ./
          python -m compileall -q research_lab scripts
      - name: Install and smoke-test benchmark modules
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-model.txt
          python - <<'PY'
          from research_lab.game_sim.ablation_v2 import fit_nb2_dispersion, finite_path_log_loss_correction, denoised_calibration
          from research_lab.game_sim.oracle import OracleRelieverOrderPolicy
          from research_lab.game_sim.locked_pa_provider import LockedPAModelProvider
          print('benchmark modules import successfully')
          PY
      - name: Commit applied patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .bootstrap/game_v2_core_patch.zip .github/workflows/apply-game-v2-core-patch.yml
          git add requirements-model.txt research_lab scripts model_runs .github/workflows/2025-pa-ablation-1000.yml
          git commit -m "Add locked-model 2025 ablation and bullpen oracle benchmark"
          git push origin HEAD:feature/game-simulator-v2-locked-model
