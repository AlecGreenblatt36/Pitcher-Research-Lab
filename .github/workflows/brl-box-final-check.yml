name: BRL box display identity check
on:
  push:
    branches: [feature/box-score-sprint-20261006]
    paths: [.github/workflows/brl-box-final-check.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/box-score-sprint-20261006
      - name: Apply and test exact-version rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,subprocess
          p=Path('brl_live/box_page.py');s=p.read_text()
          old="function boxFor(pk){return Object.entries(D.box_scores||{}).filter(([id,b])=>String(b.game_pk)===String(pk)).sort((a,b)=>a[1].saved_at.localeCompare(b[1].saved_at)).at(-1);}"
          new="function boxFor(pk){const pair=latest(pk);if(!pair)return;const box=D.box_scores?.[pair[0]];return box&&String(box.game_pk)===String(pk)?[pair[0],box]:undefined;}"
          assert s.count(old)==1;s=s.replace(old,new)
          old="${a?'Final':'Pregame'}";assert s.count(old)==1;s=s.replace(old,"${gameState(pk)}")
          old="function latest(pk){return versions(pk).at(-1);}"
          new=old+"\nfunction gameState(pk){if(D.actuals?.[pk])return 'Final';const state=String(D.status?.[pk]?.state||'');return /^(in progress|live|manager challenge|review)$/i.test(state)?'Live':/postponed|cancelled/i.test(state)?'Postponed':'Pregame';}"
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          js=next(ast.literal_eval(n.value) for n in ast.parse(s).body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='JS' for t in n.targets))
          Path('box_page_check.js').write_text(js);subprocess.run(['node','--check','box_page_check.js'],check=True)
          test='''from pathlib import Path
          import ast,subprocess
          
          def test_exact_box_version_and_live_status():
              source=Path(__file__).parents[1]/'brl_live/box_page.py'
              tree=ast.parse(source.read_text())
              js=next(ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='JS' for t in n.targets))
              functions='\\n'.join(line for line in js.splitlines() if line.startswith(('function versions(','function latest(','function boxFor(','function gameState(')))
              prefix="const assert=require('assert');const D={forecasts:{a:{game_pk:1,saved_at:'2026-10-06T18:00:00Z'},b:{game_pk:1,saved_at:'2026-10-06T19:00:00Z'}},box_scores:{a:{game_pk:1}},actuals:{},status:{1:{state:'In Progress'}}};"
              suffix="assert.equal(boxFor(1),undefined);D.box_scores.b={game_pk:1};assert.equal(boxFor(1)[0],'b');assert.equal(gameState(1),'Live');D.status[1].state='Preview';assert.equal(gameState(1),'Pregame');D.actuals[1]={};assert.equal(gameState(1),'Final');"
              subprocess.run(['node','-e',prefix+functions+suffix],check=True)
          '''
          import textwrap
          test=test.replace('          ','')
          Path('brl_live_tests/test_box_identity.py').write_text(test)
          env={};exec(compile(test,'identity','exec'),env);env['__file__']=str(Path('brl_live_tests/test_box_identity.py').resolve());env['test_exact_box_version_and_live_status']()
          print('PASS: stale boxes cannot mix with a newer forecast; Preview and Live labels are distinct.')
          PY
      - name: Commit checked source only
        run: |
          rm .github/workflows/brl-box-final-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brl_live/box_page.py brl_live_tests/test_box_identity.py
          git add -u .github/workflows/brl-box-final-check.yml
          git commit -m 'Bind every displayed box to its exact forecast version; distinguish live game status'
          git push origin HEAD:feature/box-score-sprint-20261006
