name: BRL live slate
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [brl_live/**, .github/workflows/brl-live.yml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: brl-live-slate
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the authenticated-encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Capture, forecast, preserve versions, score finals
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python brl_live/entrypoint.py --site "$RUNNER_TEMP/brl-site" --runtime "$RUNNER_TEMP/brl-private"
      - name: Upload prediction-only page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/brl-site
      - name: Save compact run receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brl-live-receipt
          path: brl_live_run_receipt.json
          retention-days: 14
          if-no-files-found: error
      - name: Remove decrypted working files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/brl-private"
    outputs:
      pages_ready: ${{ steps.live.outputs.pages_ready }}
  publish:
    if: needs.forecast.outputs.pages_ready == 'true'
    needs: forecast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only the approved page artifact
        id: deployment
        uses: actions/deploy-pages@v4
