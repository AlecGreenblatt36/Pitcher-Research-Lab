name: BRL live slate
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: 'Minutes to wait before running (used by the self-chaining dispatch)'
        required: false
        default: '0'
  push:
    branches: [main, brl-trigger]
    paths: [brl_live/**, brl_engine/**, .github/workflows/brl-live.yml, trigger/**]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: brl-live-slate
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait (self-chained runs pace themselves; GitHub's cron is unreliable at this cadence)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.wait_minutes != '0' && github.event.inputs.wait_minutes != ''
        run: sleep $(( ${{ github.event.inputs.wait_minutes }} * 60 ))
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the authenticated-encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Capture, forecast, preserve versions, score finals (own runtime)
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python brl_engine/entrypoint.py --site "$RUNNER_TEMP/brl-site" --runtime "$RUNNER_TEMP/brl-private"
      - name: Upload prediction-only page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/brl-site
      - name: Save compact run receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brl-live-receipt
          path: brl_v2_run_receipt.json
          retention-days: 14
          if-no-files-found: error
      - name: Remove decrypted working files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/brl-private"
      - name: Chain the next run (only with the dispatch token; GITHUB_TOKEN cannot start workflows)
        if: always() && env.BRL_DISPATCH_TOKEN != ''
        env:
          BRL_DISPATCH_TOKEN: ${{ secrets.BRL_DISPATCH_TOKEN }}
        run: |
          curl -sS -o /dev/null -w 'dispatch %{http_code}\n' -X POST \
            -H "Authorization: Bearer $BRL_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/brl-live.yml/dispatches" \
            -d '{"ref":"main","inputs":{"wait_minutes":"12"}}'
    outputs:
      pages_ready: ${{ steps.live.outputs.pages_ready }}
  publish:
    if: needs.forecast.outputs.pages_ready == 'true'
    needs: forecast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only the approved page artifact
        id: deployment
        uses: actions/deploy-pages@v4
