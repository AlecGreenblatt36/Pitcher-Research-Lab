name: BRL matchup report
on:
  workflow_dispatch:
    inputs:
      daily:
        description: "Build yesterday's and today's reports as the scheduled run would"
        type: boolean
        default: true
  schedule:
    - cron: '20 13 * * *'
    - cron: '35 20 * * *'
  push:
    branches: [diag/report]
permissions:
  contents: write
concurrency:
  group: brl-report-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=2,<3" "pandas>=2,<4" "scikit-learn>=1.5,<2" "scipy>=1.12,<2" joblib requests cryptography==46.0.4
      - name: Top up the season's pitch table through yesterday (sealed; incremental)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
        run: python tools/brl_bookkeeping_backfill.py
      - name: Build the day's matchup reports on the sealed pitch data (model outputs and public box-score facts only leave the runner)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
          BRL_REPORT_DAILY: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.daily == 'true')) && '1' || '' }}
        run: python tools/brl_report.py
