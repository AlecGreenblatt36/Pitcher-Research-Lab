name: BRL rosters
on:
  workflow_dispatch:
  push:
    branches: [diag/rosters]
permissions:
  contents: read
concurrency:
  group: brl-rosters-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      seasons: ${{ steps.plan.outputs.seasons }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
        with:
          persist-credentials: false
      - id: plan
        name: Seasons from tools/roster_seasons.txt (one job per season)
        run: python -c "import json; s=[int(x) for x in open('tools/roster_seasons.txt').read().replace(',', ' ').split()]; print('seasons=' + json.dumps(s))" >> "$GITHUB_OUTPUT"
  rosters:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2          # MLB's public API: two seasons at a time
      matrix:
        season: ${{ fromJson(needs.plan.outputs.seasons) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=2,<3" "pandas>=2,<4" cryptography==46.0.4
      - name: Daily active rosters, pitchers only (public data; team, date and player ids)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_SEASON: ${{ matrix.season }}
          BRL_WORKERS: '4'
        run: python tools/brl_rosters.py
