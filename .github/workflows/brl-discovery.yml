name: BRL discovery
on:
  workflow_dispatch:
  push:
    branches: [diag/discovery]
permissions:
  contents: write
concurrency:
  group: brl-discovery-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=2,<3" "pandas>=2,<4" "scikit-learn>=1.5,<2" "scipy>=1.12,<2" joblib requests cryptography==46.0.4
      - name: Registration check (the ledger must carry the experiment's row before its run)
        run: |
          ID=$(git log -1 --pretty=%s | grep -oE '[A-Z][A-Z0-9]*-[0-9]+[A-Za-z0-9]*' | head -1 || true)
          python tools/registry.py --check "${ID:-MAINT-0}"
      - name: Run the discovery experiment on the sealed pitch data (only metrics and summaries leave the runner)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
        run: python tools/brl_discovery.py
