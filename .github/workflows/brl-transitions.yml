name: BRL transitions
on:
  workflow_dispatch:
  push:
    branches: [diag/transitions]
permissions:
  contents: write
jobs:
  season:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        season: [2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4 numpy pandas
      - name: Base-running transitions from the official play-by-play (aggregate counts only leave the runner)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_SEASON: ${{ matrix.season }}
          BRL_WORKERS: '6'
        run: python tools/brl_transitions.py
