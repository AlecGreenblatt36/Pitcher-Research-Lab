name: BRL market books
on:
  workflow_dispatch:
  push:
    branches: [diag/books]
permissions:
  contents: write
jobs:
  books:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Several sportsbooks' lines for the season from SportsBookReview (public odds only, no secrets)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_BOOKS_SEASON: '2026'
        run: python tools/brl_market_books_history.py
