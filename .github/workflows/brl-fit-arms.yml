name: BRL fit arms
on:
  workflow_dispatch:
  push:
    branches: [diag/fit-arms]
permissions:
  contents: read
concurrency:
  group: brl-fit-arms
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      arms: ${{ steps.plan.outputs.arms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
        with:
          persist-credentials: false
      - id: plan
        run: echo "arms=$(python3 -c 'import json;print(json.dumps(json.load(open("tools/fit_arms.json"))["arms"]))')" >> "$GITHUB_OUTPUT"
  fit:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        arm: ${{ fromJson(needs.plan.outputs.arms) }}
    name: fit (${{ matrix.arm.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=2,<3" "pandas>=2,<4" "scikit-learn>=1.5,<2" "scipy>=1.12,<2" joblib requests cryptography==46.0.4
      - name: Fit one arm and seal it (only hashes and metrics leave the runner)
        env:
          GH_TOKEN: ${{ github.token }}
          BRL_PA_PACKAGE_KEY: ${{ secrets.BRL_PA_PACKAGE_KEY }}
          BRL_FIT_SETTINGS: ${{ toJson(matrix.arm.settings) }}
        run: python tools/brl_fit_model.py
      - name: Remove decrypted files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/brl-fit"
  compare:
    needs: fit
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=2,<3" "pandas>=2,<4" "scikit-learn>=1.5,<2" "scipy>=1.12,<2" joblib requests cryptography==46.0.4
      - name: Compare the arms game by game on the test season (metrics only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/brl_fit_compare.py
