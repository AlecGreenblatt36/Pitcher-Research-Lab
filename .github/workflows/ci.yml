name: CI

on:
  push:
    branches-ignore: ['diag/**', 'tmp-**']      # lane triggers carry commits CI already checked on their source branch
    paths-ignore: ['LEDGER.md', 'HANDOFF.md', 'discovery/**', 'tools/discovery_params.json']   # research notes and lane params only; the next code push scans the whole tree
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified from the action repository on October 9, 2026
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Compile Python
        run: python -m compileall -q -x '\.venv|case_studies' .

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in static/*.js; do
            node --check "$file"
          done

      - name: Run project validator
        run: python validate_project.py

      - name: Run regression suite
        env:
          PRL_SCREENSHOT_DIR: outputs/browser-screenshots
        run: pytest -q

      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-screenshots
          path: outputs/browser-screenshots
          retention-days: 7
          if-no-files-found: ignore
